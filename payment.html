<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarmOS — Payment</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --green:#22c55e;
  --bg:#020617;
  --card:#111827;
  --accent:#fbbf24;
}

body{
  margin:0;
  font-family:Segoe UI, Arial;
  background:var(--bg);
  color:#e5e7eb;
}

/* NAVBAR */
.navbar{
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(14px);
  padding:14px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.navbar a{
  color:#e5e7eb;
  text-decoration:none;
  font-weight:600;
}

/* CONTAINER */
.container{
  max-width:420px;
  margin:30px auto;
  background:var(--card);
  padding:24px;
  border-radius:20px;
  box-shadow:0 0 30px rgba(34,197,94,.2);
}

.container h2{
  text-align:center;
  margin-bottom:20px;
  color:var(--green);
}

input, textarea{
  width:100%;
  padding:14px;
  margin-bottom:14px;
  border-radius:12px;
  border:none;
  background:#020617;
  color:#fff;
  outline:none;
  font-size:15px;
}
textarea{resize:none;height:90px}

.methods{
  display:flex;
  gap:10px;
  margin-bottom:16px;
}
.method{
  flex:1;
  padding:12px;
  background:#020617;
  border-radius:12px;
  text-align:center;
  cursor:pointer;
  border:2px solid transparent;
}
.method.active{
  border-color:var(--green);
  box-shadow:0 0 15px rgba(34,197,94,.4);
}

.pay-btn{
  width:100%;
  padding:16px;
  border:none;
  border-radius:16px;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  font-weight:900;
  cursor:pointer;
  font-size:16px;
  color:#000;
}

.loader{
  display:none;
  text-align:center;
  margin-top:16px;
}
.spinner{
  width:40px;
  height:40px;
  border:4px solid #222;
  border-top:4px solid var(--green);
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:auto;
}
@keyframes spin{100%{transform:rotate(360deg)}}
</style>
</head>

<body>

<div class="navbar">
  <strong>FarmOS 🌿</strong>
  <a href="checkout.html">← Checkout</a>
</div>

<div class="container">
  <h2>Delivery & Payment</h2>

  <input type="text" id="name" placeholder="Full Name">
  <input type="text" id="phone" placeholder="Mobile Number">
  <textarea id="address" placeholder="Complete Address"></textarea>

  <div class="methods">
    <div class="method active" onclick="selectMethod(this)">UPI</div>
    <div class="method" onclick="selectMethod(this)">Card</div>
    <div class="method" onclick="selectMethod(this)">COD</div>
  </div>

  <button class="pay-btn" onclick="payNow()">Pay Now</button>

  <div class="loader" id="loader">
    <div class="spinner"></div>
    <p>Processing payment…</p>
  </div>
</div>

<script>
function selectMethod(el){
  document.querySelectorAll('.method').forEach(m=>m.classList.remove('active'));
  el.classList.add('active');
}

function generateOrderId(){
  return "FMOS" + Math.floor(1000 + Math.random() * 9000);
}

function payNow(){
  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const address = document.getElementById("address").value.trim();

  if(name === "" || phone === "" || address === ""){
    alert("❗ Please fill all address details");
    return;
  }

  let cart = JSON.parse(localStorage.getItem("cart")) || {};

  if(Object.keys(cart).length === 0){
    alert("Cart is empty!");
    return;
  }

  let total = 0;
  let items = [];

  for(let k in cart){
    total += cart[k].kg * cart[k].price;
    items.push({
      name: k,
      kg: cart[k].kg,
      price: cart[k].price
    });
  }

  const orderId = generateOrderId();

  let newOrder = {
    id: orderId,
    customer: name,
    phone: phone,
    address: address,
    items: items,
    total: total,
    status: "pending",
    time: new Date().toLocaleString()
  };

  let orders = JSON.parse(localStorage.getItem("orders")) || [];

  orders.push(newOrder);

  localStorage.setItem("orders", JSON.stringify(orders));

  document.querySelector(".pay-btn").style.display="none";
  document.getElementById("loader").style.display="block";

  setTimeout(()=>{
    alert("✅ Payment Successful!\nYour order ID: " + orderId);
    localStorage.removeItem("cart");
    window.location.href="tracking.html";
  },2000);
}
</script>

</body>
</html>
