 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarmOS Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Segoe UI", Arial, sans-serif;
  background:#f8fafc;
  color:#0f172a;
}

/* NAVBAR */
.navbar{
  background:#ffffff;
  padding:16px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #e5e7eb;
  box-shadow:0 3px 6px rgba(0,0,0,0.05);
}

.navbar strong{
  color:#16a34a;
  font-size:20px;
}

.navbar button{
  padding:8px 14px;
  border:none;
  border-radius:10px;
  background:#ef4444;
  color:white;
  font-weight:700;
  cursor:pointer;
  transition:0.3s;
}
.navbar button:hover{
  background:#dc2626;
}

/* CONTAINER */
.container{
  max-width:900px;
  margin:30px auto;
  padding:20px;
}

/* CARD */
.card{
  background:white;
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
  margin-bottom:20px;
  transition:0.3s;
}
.card:hover{
  box-shadow:0 15px 30px rgba(0,0,0,.1);
}

/* CHECKPOINT */
.checkpoint{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid #e5e7eb;
}
.checkpoint:last-child{border:none}

.info strong{
  color:#16a34a;
  font-size:16px;
}
.info span{
  display:block;
  font-size:14px;
  color:#475569;
  margin-top:2px;
}

/* STATUS */
.status{
  font-weight:700;
  margin-bottom:6px;
}
.pending{color:#f59e0b;}
.reached{color:#16a34a;}

/* BUTTON */
.btn{
  padding:8px 14px;
  border:none;
  border-radius:10px;
  background:#16a34a;
  color:white;
  font-weight:700;
  cursor:pointer;
  transition:0.3s;
}
.btn:hover{
  background:#15803d;
}

.note{
  margin-top:20px;
  font-size:13px;
  color:#64748b;
}
</style>
</head>

<body>

<div class="navbar">
  <strong>FarmOS Admin 🚚</strong>
  <div>
    <button onclick="location.href='index.html'">Home</button>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<div class="container">

  <div class="card">
    <h2>Truck Checkpoints</h2>
    <p>Farmer-led distribution control panel</p>
  </div>

  <div class="card" id="checkpointList"></div>

  <div class="note">
    ✔ Admin updates checkpoint status manually after truck arrival.<br>
    ✔ Customers collect orders using stamped Order ID.
  </div>

</div>

 <script>
/* 🔐 SIMPLE ADMIN PASSWORD CHECK */
(function adminAuth(){
  const ADMIN_PASSWORD = "farmos@admin"; // change password here

  let entered = prompt("Enter Admin Password:");

  if (entered === null || entered !== ADMIN_PASSWORD) {
    alert("❌ Access Denied");
    window.location.href = "index.html";
  }
})();
 </script>
<script>
const checkpoints = [
  {name:"Main Vegetable Market", orders:42, status:"pending"},
  {name:"Hotel Zone East", orders:18, status:"pending"},
  {name:"Residential Sector 5", orders:27, status:"pending"},
  {name:"Highway Pickup Point", orders:15, status:"pending"}
];

function render(){
  let html="";
  checkpoints.forEach((c,i)=>{
    html+=`
      <div class="checkpoint">
        <div class="info">
          <strong>${c.name}</strong>
          <span>Orders: ${c.orders}</span>
        </div>
        <div>
          <div class="status ${c.status}">
            ${c.status === "pending" ? "Pending" : "Reached"}
          </div>
          ${
            c.status === "pending"
            ? `<button class="btn" onclick="markReached(${i})">Mark Reached</button>`
            : ``
          }
        </div>
      </div>
    `;
  });
  document.getElementById("checkpointList").innerHTML = html;
}

function markReached(i){
  checkpoints[i].status = "reached";
  render();
}

function logout(){
  alert("Logged out");
  location.href="index.html";
}

render();
</script>

</body>
</html>
