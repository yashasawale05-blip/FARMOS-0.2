<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarmOS — Payment</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  background:#020617;
  color:#fff;
  font-family:Segoe UI;
}
.box{
  max-width:400px;
  margin:40px auto;
  background:#111827;
  padding:20px;
  border-radius:16px;
}
input,textarea,button{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:none;
}
button{
  background:#22c55e;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="box">
  <h2>Place Order</h2>
  <input placeholder="Full Name">
  <input placeholder="Phone">
  <textarea placeholder="Address"></textarea>
  <button onclick="done()">Confirm Order</button>
</div>

<script>
function done(){
  localStorage.removeItem("cart");
  alert("Order placed successfully 🌿");
  location.href="index.html";
}
</script>

</body>
</html>
