<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarmOS — Track Order</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --green:#22c55e;
  --bg:#020617;
  --glass:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.12);
  --accent:#fbbf24;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Segoe UI, Arial;
  background:
    linear-gradient(180deg, rgba(0,0,0,.7), rgba(0,0,0,.95)),
    url("https://images.unsplash.com/photo-1506806732259-39c2d0268443");
  background-size:cover;
  background-attachment:fixed;
  color:#e5e7eb;
}

/* NAVBAR */
.navbar{
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(14px);
  padding:14px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
}
.navbar a{
  color:#e5e7eb;
  text-decoration:none;
  font-weight:600;
  margin-left:18px;
}
.navbar a:hover{color:var(--green);}

/* CONTAINER */
.container{
  max-width:820px;
  margin:40px auto;
  padding:20px;
}

/* CARD */
.card{
  background:linear-gradient(180deg,var(--glass),rgba(255,255,255,.02));
  border:1px solid var(--border);
  backdrop-filter:blur(14px);
  border-radius:26px;
  padding:30px;
  box-shadow:0 30px 60px rgba(0,0,0,.7);
}

/* HEADER */
.header{
  text-align:center;
}
.header h1{
  margin-bottom:6px;
  color:var(--green);
}
.badge{
  display:inline-block;
  background:rgba(34,197,94,.15);
  color:var(--green);
  padding:6px 14px;
  border-radius:30px;
  font-weight:700;
  font-size:13px;
}

/* TRUCK */
.truck{
  text-align:center;
  font-size:52px;
  margin:22px 0;
  animation:move 1.6s ease-in-out infinite alternate;
}
@keyframes move{
  from{transform:translateX(-12px)}
  to{transform:translateX(12px)}
}

/* TIMELINE */
.timeline{
  margin-top:30px;
  position:relative;
}
.timeline::before{
  content:"";
  position:absolute;
  left:18px;
  top:0;
  width:3px;
  height:100%;
  background:rgba(255,255,255,.1);
}

.step{
  display:flex;
  align-items:flex-start;
  margin-bottom:26px;
  opacity:.35;
  transition:.6s;
  position:relative;
}
.step.active{opacity:1}

.circle{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#1f2937;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-right:16px;
  font-size:18px;
  z-index:2;
}
.step.active .circle{
  background:var(--green);
  color:black;
  box-shadow:0 0 20px rgba(34,197,94,.6);
}

.text strong{
  font-size:16px;
}
.text span{
  font-size:13px;
  opacity:.8;
}

/* BUTTONS */
.actions{
  margin-top:30px;
  display:flex;
  justify-content:center;
  gap:16px;
  flex-wrap:wrap;
}

.btn{
  padding:14px 26px;
  border-radius:18px;
  font-weight:900;
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:8px;
  transition:.3s;
}

.btn-primary{
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:black;
}

.btn-secondary{
  border:1px solid var(--border);
  color:var(--accent);
}

.btn:hover{
  transform:scale(1.07);
  box-shadow:0 10px 30px rgba(34,197,94,.5);
}
</style>
</head>

<body>

<div class="navbar">
  <strong>FarmOS 🌿</strong>
  <div>
    <a href="product.html">Shop</a>
  </div>
</div>

<div class="container">
  <div class="card">

    <div class="header">
      <h1>Track Your Order</h1>
      <span class="badge">Order ID: FM<span id="oid"></span></span>
    </div>

    <div class="truck">🚚</div>

    <div class="timeline">
      <div class="step active">
        <div class="circle">✓</div>
        <div class="text">
          <strong>Order Confirmed</strong>
          <span>We received your order</span>
        </div>
      </div>

      <div class="step">
        <div class="circle">📦</div>
        <div class="text">
          <strong>Packed</strong>
          <span>Fresh vegetables packed</span>
        </div>
      </div>

      <div class="step">
        <div class="circle">🚚</div>
        <div class="text">
          <strong>Out for Delivery</strong>
          <span>Delivery partner on the way</span>
        </div>
      </div>

      <div class="step">
        <div class="circle">🏡</div>
        <div class="text">
          <strong>Delivered</strong>
          <span>Enjoy farm-fresh food 🌱</span>
        </div>
      </div>
    </div>

    <div class="actions">
      <a href="product.html" class="btn btn-secondary">🛒 Back to Shop</a>
      <a href="index.html" class="btn btn-primary">🏠 Home</a>
    </div>

  </div>
</div>

<script>
document.getElementById("oid").innerText =
  Math.floor(100000 + Math.random()*900000);

const steps=document.querySelectorAll(".step");
let i=1;
setInterval(()=>{
  if(i<steps.length){
    steps[i].classList.add("active");
    i++;
  }
},2000);
</script>

</body>
</html>
