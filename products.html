<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarmOS — Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Segoe UI, Arial;
  background:#020617;
  color:#fff;
}
.navbar{
  padding:14px 24px;
  background:#000;
  display:flex;
  justify-content:space-between;
}
.navbar a{color:white;text-decoration:none}

.container{
  max-width:1200px;
  margin:30px auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
  padding:20px;
}
.card{
  background:#111827;
  padding:16px;
  border-radius:16px;
  text-align:center;
}
.card img{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:12px;
}
button{
  background:#22c55e;
  border:none;
  padding:10px 16px;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
}
.cart{
  position:fixed;
  top:80px;
  right:20px;
  background:#22c55e;
  padding:12px 18px;
  border-radius:30px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="navbar">
  <strong>FarmOS 🌿</strong>
  <a href="checkout.html">Checkout</a>
</div>

<div class="cart" onclick="goCheckout()">🛒 <span id="count">0</span></div>

<div class="container" id="list"></div>

<script>
const products = {
  Tomato:{price:40,img:"https://raw.githubusercontent.com/yashasawale05-blip/FARMOS-0.2/main/tomato.jpg"},
  Potato:{price:25,img:"https://raw.githubusercontent.com/yashasawale05-blip/FARMOS-0.2/main/potato.jpg"},
  Onion:{price:40,img:"https://raw.githubusercontent.com/yashasawale05-blip/FARMOS-0.2/main/onion.jpg"},
  Carrot:{price:40,img:"https://raw.githubusercontent.com/yashasawale05-blip/FARMOS-0.2/main/carrot.jpg"}
};

let cart = JSON.parse(localStorage.getItem("cart")) || {};

function render(){
  let html="";
  for(let p in products){
    let qty = cart[p]?.kg || 0;
    html += `
      <div class="card">
        <img src="${products[p].img}">
        <h3>${p}</h3>
        <p>₹${products[p].price}/kg</p>
        <p>Qty: ${qty}</p>
        <button onclick="addToCart('${p}')">Add</button>
      </div>
    `;
  }
  document.getElementById("list").innerHTML = html;
  document.getElementById("count").innerText =
    Object.values(cart).reduce((s,i)=>s+i.kg,0);
}

function addToCart(p){
  if(!cart[p]){
    cart[p] = {kg:0, price:products[p].price, img:products[p].img};
  }
  cart[p].kg++;
  localStorage.setItem("cart", JSON.stringify(cart));
  render();
}

function goCheckout(){
  window.location.href="checkout.html";
}

render();
</script>

</body>
</html>
