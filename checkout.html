<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Checkout</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#020617;color:#fff;font-family:Segoe UI;margin:0;}
.item{background:#111827;margin:10px;padding:14px;border-radius:14px;display:flex;justify-content:space-between;}
button{padding:10px;border:none;border-radius:12px;background:#22c55e;font-weight:900;}
</style>
</head>

<body>

<h2 style="text-align:center">Checkout</h2>
<div id="cart"></div>
<h3 style="text-align:right;padding:14px">Total ₹<span id="total">0</span></h3>

<button onclick="location.href='payment.html'" style="margin:20px auto;display:block">
Place Order
</button>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || {};
let box=document.getElementById("cart");
let total=0;

for(let k in cart){
  let t=cart[k].kg*cart[k].price;
  total+=t;
  box.innerHTML+=`<div class="item">${k} × ${cart[k].kg} <b>₹${t}</b></div>`;
}
document.getElementById("total").innerText=total;
</script>

</body>
</html>
