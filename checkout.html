<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarmOS — Checkout</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Segoe UI, Arial;
  background:#020617;
  color:#e5e7eb;
}

h1{text-align:center;margin:20px}

.cart{
  max-width:800px;
  margin:20px auto;
  padding:20px;
}

.item{
  display:flex;
  align-items:center;
  gap:16px;
  background:#111827;
  padding:12px;
  border-radius:14px;
  margin-bottom:12px;
}

.item img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:10px;
}

.info{flex:1}

.qty{
  display:flex;
  gap:10px;
}

.qty button{
  width:30px;
  height:30px;
  border-radius:50%;
  border:none;
  background:#22c55e;
  font-weight:bold;
  cursor:pointer;
}

.total{
  text-align:right;
  font-size:20px;
  margin-top:20px;
}

.place{
  display:block;
  margin:30px auto;
  background:#22c55e;
  color:black;
  padding:14px;
  border-radius:14px;
  width:240px;
  text-align:center;
  font-weight:900;
  text-decoration:none;
}
</style>
</head>

<body>

<h1>Checkout</h1>

<div class="cart" id="cartBox"></div>

<div class="total">
Total: ₹<span id="totalPrice">0</span>
</div>

<a href="#" class="place" onclick="placeOrder()">Place Order</a>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || {};
render();

function render(){
  let html="", total=0;
  for(let name in cart){
    let item = cart[name];
    let itemTotal = item.kg * item.price;
    total += itemTotal;

    html += `
    <div class="item">
      <img src="${item.image}">
      <div class="info">
        <strong>${name}</strong><br>
        ₹${item.price} / kg
      </div>
      <div class="qty">
        <button onclick="change('${name}',-1)">−</button>
        <span>${item.kg}</span>
        <button onclick="change('${name}',1)">+</button>
      </div>
      <strong>₹${itemTotal}</strong>
    </div>`;
  }

  document.getElementById("cartBox").innerHTML =
    html || "<p>Your cart is empty 🌱</p>";
  document.getElementById("totalPrice").innerText = total;
}

function change(name,val){
  cart[name].kg += val;
  if(cart[name].kg<=0) delete cart[name];
  localStorage.setItem("cart",JSON.stringify(cart));
  render();
}

function placeOrder(){
  alert("Order placed successfully 🌿");
  localStorage.removeItem("cart");
  window.location.href="product.html";
}
</script>

</body>
</html>
