<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarmOS Admin Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Segoe UI, Arial;
  background:#f8fafc;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.login-box{
  background:white;
  padding:40px 30px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.1);
  text-align:center;
  width:90%;
  max-width:400px;
}

.login-box h2{
  color:#16a34a;
  margin-bottom:20px;
}

.login-box input{
  width:100%;
  padding:12px;
  margin-bottom:16px;
  border-radius:10px;
  border:1px solid #e5e7eb;
  font-size:16px;
}

.login-box button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#16a34a;
  color:white;
  font-weight:700;
  cursor:pointer;
  font-size:16px;
}

.error-msg{
  color:#ef4444;
  margin-bottom:12px;
  font-weight:600;
  display:none;
}
</style>
</head>
<body>

<div class="login-box">
  <h2>Admin Login</h2>
  <div class="error-msg" id="errorMsg">Incorrect password!</div>
  <input type="password" id="password" placeholder="Enter admin password">
  <button onclick="checkLogin()">Login</button>
</div>

<script>
const ADMIN_PASSWORD = "Farmos123"; // set your password here

function checkLogin(){
  const pass = document.getElementById("password").value;
  const error = document.getElementById("errorMsg");
  if(pass === "admin123"){
    window.location.href = "admin.html"; // redirect on success
  } else {
    error.style.display = "block";
  }
}
</script>

</body>
</html>
