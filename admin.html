<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarmOS — Admin Truck Control</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --green:#22c55e;
  --bg:#f9fafb;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --border:#e5e7eb;
  --pending:#f59e0b;
}

body{
  margin:0;
  font-family:Segoe UI, Arial;
  background:var(--bg);
  color:var(--text);
}

/* NAVBAR */
.navbar{
  padding:16px 26px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:white;
  border-bottom:1px solid var(--border);
}

/* CONTAINER */
.container{
  max-width:1100px;
  margin:30px auto;
  padding:0 20px;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
  padding:22px;
  border-radius:20px;
  margin-bottom:30px;
}

/* CARD */
.card{
  background:var(--card);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.06);
  margin-bottom:24px;
}

/* TRUCK SELECTOR */
.trucks{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
}
.truck-btn{
  padding:12px 18px;
  border-radius:14px;
  border:2px solid var(--border);
  cursor:pointer;
  font-weight:700;
  background:white;
}
.truck-btn.active{
  border-color:var(--green);
  color:var(--green);
}

/* MAP */
.map{
  position:relative;
  height:120px;
  background:#f1f5f9;
  border-radius:16px;
  padding:30px 20px;
}
.route{
  height:6px;
  background:#d1d5db;
  border-radius:10px;
  position:relative;
}
.dot{
  position:absolute;
  top:-7px;
  width:20px;
  height:20px;
  border-radius:50%;
  border:4px solid white;
}
.pending{background:var(--pending)}
.reached{background:var(--green)}
.label{
  position:absolute;
  top:22px;
  font-size:12px;
  color:var(--muted);
}

/* LIST */
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid var(--border);
}
.row:last-child{border:none}

/* BUTTON */
.btn{
  padding:8px 14px;
  border:none;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
}
</style>
</head>

<body>

<div class="navbar">
  <strong>FarmOS 🌿 Admin</strong>
  <span>Multi-Truck Distribution System</span>
</div>

<div class="container">

  <div class="header">
    <h2>🚚 Truck Management</h2>
    <p>Farmers distribute pre-packed orders at checkpoints</p>
  </div>

  <!-- TRUCK SELECT -->
  <div class="card">
    <h3>Select Truck</h3>
    <div class="trucks" id="truckTabs"></div>
  </div>

  <!-- MAP -->
  <div class="card">
    <h3>🗺️ Truck Route</h3>
    <div class="map">
      <div class="route" id="route"></div>
    </div>
  </div>

  <!-- CHECKPOINT LIST -->
  <div class="card" id="checkpointList"></div>

</div>

<script>
const trucks = [
  {
    name:"Truck A — Hotel Supply",
    checkpoints:[
      {name:"Hotel Zone East",pos:20,orders:18,status:"pending"},
      {name:"Hotel Zone West",pos:60,orders:22,status:"pending"}
    ]
  },
  {
    name:"Truck B — Residential",
    checkpoints:[
      {name:"Sector 5",pos:15,orders:27,status:"pending"},
      {name:"Sector 9",pos:55,orders:19,status:"pending"},
      {name:"Sector 12",pos:85,orders:14,status:"pending"}
    ]
  },
  {
    name:"Truck C — Highway Outlet",
    checkpoints:[
      {name:"Highway Stop 1",pos:35,orders:15,status:"pending"},
      {name:"Highway Stop 2",pos:75,orders:11,status:"pending"}
    ]
  }
];

let currentTruck = 0;

function renderTabs(){
  let html="";
  trucks.forEach((t,i)=>{
    html+=`
      <div class="truck-btn ${i===currentTruck?'active':''}"
        onclick="selectTruck(${i})">
        ${t.name}
      </div>
    `;
  });
  document.getElementById("truckTabs").innerHTML = html;
}

function renderTruck(){
  const route = document.getElementById("route");
  route.innerHTML="";
  trucks[currentTruck].checkpoints.forEach(c=>{
    route.innerHTML+=`
      <div class="dot ${c.status}" style="left:${c.pos}%"></div>
      <div class="label" style="left:${c.pos-4}%">${c.name}</div>
    `;
  });

  let list="";
  trucks[currentTruck].checkpoints.forEach((c,i)=>{
    list+=`
      <div class="row">
        <div>
          <strong>${c.name}</strong><br>
          Orders: ${c.orders}
        </div>
        <div>
          <span style="color:${c.status==='pending'?'#f59e0b':'#22c55e'}">
            ${c.status === "pending" ? "Pending" : "Reached"}
          </span><br>
          ${
            c.status==="pending"
            ? `<button class="btn" onclick="markReached(${i})">Mark Reached</button>`
            : ""
          }
        </div>
      </div>
    `;
  });
  document.getElementById("checkpointList").innerHTML = list;
}

function selectTruck(i){
  currentTruck=i;
  renderTabs();
  renderTruck();
}

function markReached(i){
  trucks[currentTruck].checkpoints[i].status="reached";
  renderTruck();
}

renderTabs();
renderTruck();
</script>

</body>
</html>
