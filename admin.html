<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarmOS — Admin Control</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --green:#22c55e;
  --bg:#f9fafb;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --border:#e5e7eb;
  --pending:#f59e0b;
}

body{
  margin:0;
  font-family:Segoe UI, Arial;
  background:var(--bg);
  color:var(--text);
}

/* NAVBAR */
.navbar{
  padding:16px 26px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:white;
  border-bottom:1px solid var(--border);
}

/* CONTAINER */
.container{
  max-width:1000px;
  margin:30px auto;
  padding:0 20px;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
  padding:22px;
  border-radius:20px;
  margin-bottom:30px;
}

/* CARD */
.card{
  background:var(--card);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.06);
  margin-bottom:24px;
}

/* MAP */
.map{
  position:relative;
  height:120px;
  background:#f1f5f9;
  border-radius:16px;
  padding:30px 20px;
}
.route{
  height:6px;
  background:#d1d5db;
  border-radius:10px;
  position:relative;
}
.checkpoint-dot{
  position:absolute;
  top:-7px;
  width:20px;
  height:20px;
  border-radius:50%;
  border:4px solid white;
}
.pending-dot{background:var(--pending)}
.reached-dot{background:var(--green)}
.label{
  position:absolute;
  top:22px;
  font-size:12px;
  color:var(--muted);
  white-space:nowrap;
}

/* CHECKPOINT LIST */
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid var(--border);
}
.row:last-child{border:none}

/* BUTTON */
.btn{
  padding:8px 14px;
  border:none;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
}

/* STATUS */
.pending{color:var(--pending)}
.reached{color:var(--green)}
</style>
</head>

<body>

<div class="navbar">
  <strong>FarmOS 🌿 Admin</strong>
  <span>Truck Distribution Control</span>
</div>

<div class="container">

  <div class="header">
    <h2>🚚 Truck Route & Checkpoints</h2>
    <p>Farmers distribute pre-packed orders at checkpoints</p>
  </div>

  <!-- MAP VIEW -->
  <div class="card">
    <h3>🗺️ Route Overview</h3>
    <div class="map">
      <div class="route" id="route"></div>
    </div>
  </div>

  <!-- CHECKPOINT LIST -->
  <div class="card" id="checkpointList"></div>

</div>

<script>
const checkpoints = [
  {name:"Main Vegetable Market", pos:5, orders:42, status:"pending"},
  {name:"Hotel Zone – East", pos:30, orders:18, status:"pending"},
  {name:"Residential Area – Sector 5", pos:60, orders:27, status:"pending"},
  {name:"Highway Outlet Stop", pos:85, orders:15, status:"pending"}
];

function render(){
  // Map
  let route = document.getElementById("route");
  route.innerHTML="";
  checkpoints.forEach(c=>{
    route.innerHTML+=`
      <div class="checkpoint-dot ${c.status === "pending" ? "pending-dot" : "reached-dot"}"
        style="left:${c.pos}%">
      </div>
      <div class="label" style="left:${c.pos-4}%">
        ${c.name}
      </div>
    `;
  });

  // List
  let html="";
  checkpoints.forEach((c,i)=>{
    html+=`
      <div class="row">
        <div>
          <strong>${c.name}</strong><br>
          Orders: ${c.orders}
        </div>
        <div>
          <span class="${c.status}">
            ${c.status === "pending" ? "Pending" : "Reached"}
          </span><br>
          ${
            c.status === "pending"
            ? `<button class="btn" onclick="markReached(${i})">Mark Reached</button>`
            : ""
          }
        </div>
      </div>
    `;
  });
  document.getElementById("checkpointList").innerHTML = html;
}

function markReached(i){
  checkpoints[i].status="reached";
  render();
}

render();
</script>

</body>
</html>
