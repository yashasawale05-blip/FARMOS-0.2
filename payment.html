<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarmOS — Payment</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --green:#22c55e;
  --bg:#020617;
  --accent:#fbbf24;
}

body{
  margin:0;
  font-family:Segoe UI, Arial;
  background:var(--bg);
  color:#e5e7eb;
}

/* NAVBAR */
.navbar{
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(14px);
  padding:14px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:50;
}
.navbar a{
  color:#e5e7eb;
  text-decoration:none;
  font-weight:600;
  margin-left:18px;
}
.navbar a:hover{color:var(--green);}

/* CART FLOAT */
.cart-float{
  position:fixed;
  top:80px;
  right:20px;
  background: linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
  padding:12px 20px;
  border-radius:50px;
  font-weight:800;
  cursor:pointer;
  z-index:60;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:16px;
  box-shadow:0 4px 15px rgba(0,0,0,0.4);
}
#cartCount{
  display:inline-block;
  min-width:24px;
  height:24px;
  line-height:24px;
  text-align:center;
  border-radius:50%;
  background:#fff;
  color:#22c55e;
  font-weight:bold;
  font-size:14px;
}

/* SECTIONS */
.container{
  max-width:800px;
  margin:20px auto;
  padding:20px;
  background:rgba(0,0,0,0.6);
  border-radius:16px;
  backdrop-filter:blur(14px);
}

/* CART ITEMS */
.cart{
  margin-bottom:20px;
}
.item{
  display:flex;
  align-items:center;
  gap:16px;
  background:#111827;
  padding:12px;
  border-radius:14px;
  margin-bottom:12px;
}
.item img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:10px;
}
.info{flex:1;}
.qty{display:flex;gap:10px;}
.qty button{
  width:30px;
  height:30px;
  border-radius:50%;
  border:none;
  background:var(--green);
  font-weight:bold;
  cursor:pointer;
}

/* FORM */
form{
  display:flex;
  flex-direction:column;
  gap:12px;
}
form input, form select{
  padding:12px;
  border-radius:10px;
  border:none;
  background:#111827;
  color:#e5e7eb;
}
form input:focus, form select:focus{
  outline:2px solid var(--green);
}

/* BUTTONS */
.place{
  display:block;
  margin:20px auto;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:black;
  padding:14px;
  border-radius:14px;
  width:240px;
  text-align:center;
  font-weight:900;
  text-decoration:none;
  cursor:pointer;
}
.back{
  display:block;
  margin:10px auto;
  width:140px;
  text-align:center;
  color:var(--accent);
  cursor:pointer;
  text-decoration:underline;
}

/* TOTAL */
.total{
  text-align:right;
  font-size:20px;
  margin-top:10px;
}
</style>
</head>
<body>

<div class="navbar">
  <strong>FarmOS 🌿</strong>
  <div>
    <a href="index.html">Home</a>
    <a href="product.html">Shop</a>
  </div>
</div>

<div class="cart-float" onclick="alert('Go to Shop to see cart')">
🛒 <span id="cartCount">0</span>
</div>

<h1 style="text-align:center;margin-top:20px">Payment & Address</h1>

<div class="container">

<h3>Your Cart</h3>
<div class="cart" id="cartBox"></div>
<div class="total">
Total: ₹<span id="totalPrice">0</span>
</div>

<h3>Shipping Address</h3>
<form id="addressForm">
  <input type="text" placeholder="Full Name" id="name" required>
  <input type="text" placeholder="Street Address" id="street" required>
  <input type="text" placeholder="City" id="city" required>
  <input type="text" placeholder="PIN / ZIP" id="pin" required>
</form>

<h3>Payment Method</h3>
<form id="paymentForm">
  <select id="paymentType" required>
    <option value="">Select Payment Method</option>
    <option value="card">Card</option>
    <option value="upi">UPI</option>
    <option value="cash">Cash on Delivery</option>
  </select>
</form>

<span class="back" onclick="window.location.href='checkout.html'">← Back to Checkout</span>
<button class="place" onclick="payNow()">Pay Now</button>

</div>

<script>
let cart=JSON.parse(localStorage.getItem("cart"))||{};
updateCart();

function updateCart(){
  let html="",total=0;
  for(let name in cart){
    let item=cart[name];
    let itemTotal=item.kg*item.price;
    total+=itemTotal;
    html+=`
    <div class="item">
      <img src="${item.img}">
      <div class="info"><strong>${name}</strong><br>₹${item.price}/kg × ${item.kg}</div>
      <strong>₹${itemTotal}</strong>
    </div>`;
  }
  document.getElementById("cartBox").innerHTML = html || "<p>Cart is empty 🌱</p>";
  document.getElementById("totalPrice").innerText = total;
  document.getElementById("cartCount").innerText = Object.values(cart).reduce((s,i)=>s+i.kg,0);
}

function payNow(){
  const name=document.getElementById("name").value.trim();
  const street=document.getElementById("street").value.trim();
  const city=document.getElementById("city").value.trim();
  const pin=document.getElementById("pin").value.trim();
  const method=document.getElementById("paymentType").value;

  if(!name||!street||!city||!pin||!method){
    alert("Please fill all fields and select a payment method");
    return;
  }

  alert(`Payment Successful! 🌿\n\nName: ${name}\nAddress: ${street}, ${city}, ${pin}\nPayment: ${method}`);
  localStorage.removeItem("cart");
  window.location.href="product.html";
}
</script>

</body>
    </html>
