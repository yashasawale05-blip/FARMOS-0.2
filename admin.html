<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarmOS Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Segoe UI, Arial;
  background:#f8fafc;
  color:#0f172a;
}

/* NAVBAR */
.navbar{
  background:white;
  padding:16px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #e5e7eb;
}

.navbar strong{
  color:#16a34a;
  font-size:20px;
}

/* BUTTON STYLE */
.btn{
  padding:8px 14px;
  border:none;
  border-radius:10px;
  background:#16a34a;
  color:white;
  font-weight:700;
  cursor:pointer;
  margin-left:10px;
}

.logout{
  background:#ef4444;
}

/* CONTAINER */
.container{
  max-width:900px;
  margin:30px auto;
  padding:20px;
}

/* CARD */
.card{
  background:white;
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
  margin-bottom:20px;
}

/* CHECKPOINT */
.checkpoint{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid #e5e7eb;
}
.checkpoint:last-child{border:none}

.info strong{
  color:#16a34a;
  font-size:16px;
}

/* STATUS */
.status{
  font-weight:700;
}
.pending{color:#f59e0b}
.reached{color:#16a34a}

.nav-actions{
  display:flex;
  gap:10px;
}
</style>
</head>

<body>

<div class="navbar">
  <strong>FarmOS Admin 🚚</strong>

  <div class="nav-actions">
    <button class="btn" onclick="location.href='admin-orders.html'">
      Orders
    </button>

    <button class="btn" onclick="location.href='admin-history.html'">
      Delivered History
    </button>

    <button class="btn logout" onclick="logout()">
      Logout
    </button>
  </div>
</div>

<div class="container">

  <div class="card">
    <h2>Admin Control Panel</h2>
    <p>Manage orders and truck checkpoints</p>

    <div style="margin-top:15px; display:flex; gap:10px;">
      <button class="btn" onclick="location.href='admin-orders.html'">
        View Customer Orders
      </button>

      <button class="btn" onclick="location.href='admin-history.html'">
        Delivered Order History
      </button>
    </div>
  </div>

  <div class="card" id="checkpointList"></div>

</div>

<script>
const checkpoints = [
  {name:"Main Vegetable Market", orders:42, status:"pending"},
  {name:"Hotel Zone East", orders:18, status:"pending"},
  {name:"Residential Sector 5", orders:27, status:"pending"},
  {name:"Highway Pickup Point", orders:15, status:"pending"}
];

function render(){
  let html="";
  checkpoints.forEach((c,i)=>{
    html+=`
      <div class="checkpoint">
        <div class="info">
          <strong>${c.name}</strong><br>
          Orders: ${c.orders}
        </div>
        <div>
          <div class="status ${c.status}">
            ${c.status === "pending" ? "Pending" : "Reached"}
          </div>
          ${
            c.status === "pending"
            ? `<button class="btn" onclick="markReached(${i})">Mark Reached</button>`
            : ``
          }
        </div>
      </div>
    `;
  });
  document.getElementById("checkpointList").innerHTML = html;
}

function markReached(i){

  checkpoints[i].status = "reached";

  // load existing history
  let history = JSON.parse(localStorage.getItem("deliveredHistory")) || [];

  // push new delivered entry
  history.push({
    id: "ORD-" + Date.now(),
    customer: checkpoints[i].name,
    items: checkpoints[i].orders + " Veggie Packs",
    date: new Date().toLocaleString()
  });

  // save back to localStorage
  localStorage.setItem("deliveredHistory", JSON.stringify(history));

  render();
}

function logout(){
  alert("Logged out successfully");
  location.href="index.html";
}

render();
</script>

</body>
</html>
