<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarmOS Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box;}

body {
  margin:0;
  font-family:"Segoe UI", Arial, sans-serif;
  background:#f8fafc;
  color:#0f172a;
}

/* CENTER LOGIN */
#loginScreen {
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:#f8fafc;
}

.loginBox {
  background:white;
  border-radius:18px;
  padding:30px 24px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
  width:300px;
  text-align:center;
}

.loginBox h2 {
  color:#16a34a;
  margin-bottom:20px;
}

.loginBox input {
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border:1px solid #d1d5db;
  border-radius:10px;
  outline:none;
  font-size:14px;
}

.loginBox .showPass {
  cursor:pointer;
  font-size:12px;
  color:#16a34a;
  margin-bottom:12px;
  display:block;
  text-align:right;
}

.loginBox button {
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#16a34a;
  color:white;
  font-weight:700;
  cursor:pointer;
}

/* ADMIN DASHBOARD */
#adminDashboard { display:none; }

.navbar {
  background: #ffffff;
  padding: 16px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #e5e7eb;
}

.navbar strong {
  color: #16a34a;
  font-size:20px;
}

.navbar button {
  padding:8px 14px;
  border:none;
  border-radius:10px;
  background:#ef4444;
  color:white;
  font-weight:700;
  cursor:pointer;
}

.container {
  max-width:900px;
  margin:30px auto;
  padding:20px;
}

.card {
  background:white;
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
  margin-bottom:20px;
}

.checkpoint {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid #e5e7eb;
}
.checkpoint:last-child { border-bottom:none; }

.info strong { color:#16a34a; font-size:16px; }

.status { font-weight:700; }
.pending { color:#f59e0b; }
.reached { color:#16a34a; }

.btn {
  margin-top:6px;
  padding:8px 14px;
  border:none;
  border-radius:10px;
  background:#16a34a;
  color:white;
  font-weight:700;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="loginBox">
    <h2>Admin Login</h2>
    <input type="password" id="adminPass" placeholder="Enter password">
    <span class="showPass" onclick="togglePassword()">Show Password</span>
    <button onclick="checkLogin()">Login</button>
  </div>
</div>

<!-- ADMIN DASHBOARD -->
<div id="adminDashboard">
  <div class="navbar">
    <strong>FarmOS Admin 🚚</strong>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="container">
    <div class="card">
      <h2>Truck Checkpoints</h2>
      <p>Farmer-led distribution control panel</p>
    </div>
    <div class="card" id="checkpointList"></div>
  </div>
</div>

<script>
const ADMIN_PASSWORD = "farmos@admin"; // Change your admin password

/* SHOW/HIDE PASSWORD */
function togglePassword(){
  const passField = document.getElementById("adminPass");
  passField.type = passField.type === "password" ? "text" : "password";
}

/* LOGIN CHECK */
function checkLogin(){
  const val = document.getElementById("adminPass").value;
  if(val === ADMIN_PASSWORD){
    localStorage.setItem("adminLoggedIn", "true");
    showDashboard();
  } else {
    alert("❌ Incorrect Password");
  }
}

/* SHOW DASHBOARD IF LOGGED IN */
function showDashboard(){
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("adminDashboard").style.display = "block";
  renderCheckpoints();
}

/* LOGOUT */
function logout(){
  localStorage.removeItem("adminLoggedIn");
  location.reload();
}

/* CHECK SESSION */
if(localStorage.getItem("adminLoggedIn") === "true"){
  showDashboard();
}

/* CHECKPOINT DATA */
const checkpoints = [
  {name:"Main Vegetable Market", orders:42, status:"pending"},
  {name:"Hotel Zone East", orders:18, status:"pending"},
  {name:"Residential Sector 5", orders:27, status:"pending"},
  {name:"Highway Pickup Point", orders:15, status:"pending"}
];

/* RENDER CHECKPOINTS */
function renderCheckpoints(){
  let html = "";
  checkpoints.forEach((c,i)=>{
    html += `
      <div class="checkpoint">
        <div class="info">
          <strong>${c.name}</strong><br>
          Orders: ${c.orders}
        </div>
        <div>
          <div class="status ${c.status}">
            ${c.status === "pending" ? "Pending" : "Reached"}
          </div>
          ${c.status === "pending" ? `<button class="btn" onclick="markReached(${i})">Mark Reached</button>` : ""}
        </div>
      </div>
    `;
  });
  document.getElementById("checkpointList").innerHTML = html;
}

/* MARK REACHED */
function markReached(i){
  checkpoints[i].status = "reached";
  renderCheckpoints();
}
</script>

</body>
</html>
