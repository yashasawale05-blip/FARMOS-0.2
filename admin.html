<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarmOS Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Segoe UI, Arial;
  background:#f8fafc;
  color:#0f172a;
}

/* HIDE CONTENT UNTIL LOGIN */
#dashboard{ display:none; }

/* NAVBAR */
.navbar{
  background:#ffffff;
  padding:16px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #e5e7eb;
}

.navbar strong{
  color:#16a34a;
  font-size:20px;
}

.navbar button{
  padding:8px 14px;
  border:none;
  border-radius:10px;
  background:#ef4444;
  color:white;
  font-weight:700;
  cursor:pointer;
}

/* CONTAINER */
.container{
  max-width:900px;
  margin:30px auto;
  padding:20px;
}

/* CARD */
.card{
  background:white;
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
  margin-bottom:20px;
}

/* CHECKPOINT */
.checkpoint{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid #e5e7eb;
}
.checkpoint:last-child{border:none}

.info strong{
  color:#16a34a;
  font-size:16px;
}

/* STATUS */
.status{
  font-weight:700;
}
.pending{color:#f59e0b}
.reached{color:#16a34a}

/* BUTTON */
.btn{
  margin-top:6px;
  padding:8px 14px;
  border:none;
  border-radius:10px;
  background:#16a34a;
  color:white;
  font-weight:700;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="dashboard">
  <div class="navbar">
    <strong>FarmOS Admin 🚚</strong>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="container">

    <div class="card">
      <h2>Truck Checkpoints</h2>
      <p>Farmer-led distribution control panel</p>
    </div>

    <div class="card" id="checkpointList"></div>

  </div>
</div>

<script>
const ADMIN_PASSWORD = "Farmos123"; // <-- Change your password here

function askPassword(){
  let pass = prompt("Enter admin password:");
  if(pass === null){
    // user clicked cancel
    alert("Access denied");
    location.href="index.html";
  } else if(pass !== ADMIN_PASSWORD){
    alert("Incorrect password! Try again.");
    askPassword();
  } else {
    document.getElementById("dashboard").style.display = "block";
  }
}

const checkpoints = [
  {name:"Main Vegetable Market", orders:42, status:"pending"},
  {name:"Hotel Zone East", orders:18, status:"pending"},
  {name:"Residential Sector 5", orders:27, status:"pending"},
  {name:"Highway Pickup Point", orders:15, status:"pending"}
];

function render(){
  let html="";
  checkpoints.forEach((c,i)=>{
    html+=`
      <div class="checkpoint">
        <div class="info">
          <strong>${c.name}</strong><br>
          Orders: ${c.orders}
        </div>
        <div>
          <div class="status ${c.status}">
            ${c.status === "pending" ? "Pending" : "Reached"}
          </div>
          ${
            c.status === "pending"
            ? `<button class="btn" onclick="markReached(${i})">Mark Reached</button>`
            : ``
          }
        </div>
      </div>
    `;
  });
  document.getElementById("checkpointList").innerHTML = html;
}

function markReached(i){
  checkpoints[i].status = "reached";
  render();
}

function logout(){
  alert("Logged out");
  location.href="index.html";
}

askPassword();
render();
</script>

</body>
</html>
