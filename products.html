<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FarmOS — Shop</title>

<style>
:root{
  --green:#4caf50;
  --dark:#0f172a;
  --card:#111827;
  --glass:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.12);
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family: "Segoe UI", Arial, sans-serif;
  background:
    linear-gradient(180deg, rgba(0,0,0,.6), rgba(0,0,0,.9)),
    url("https://images.unsplash.com/photo-1506806732259-39c2d0268443");
  background-size:cover;
  background-attachment:fixed;
  color:#e5e7eb;
}

/* ===== NAVBAR ===== */
.navbar{
  background:rgba(0,0,0,0.55);
  backdrop-filter: blur(12px);
  padding:14px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:20px;
  font-weight:700;
}

.nav-links{
  display:flex;
  gap:20px;
  list-style:none;
  margin:0;
  padding:0;
}

.nav-links a{
  color:#e5e7eb;
  text-decoration:none;
  font-weight:600;
}

.nav-links a:hover{color:var(--green)}

/* ===== CART ICON ===== */
.cart-icon{
  position:fixed;
  top:90px;
  right:20px;
  background:var(--green);
  color:black;
  padding:10px 16px;
  border-radius:30px;
  font-weight:700;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
  z-index:30;
}

/* ===== TITLE ===== */
h1{
  text-align:center;
  margin:30px 0 10px;
  font-size:32px;
  letter-spacing:1px;
}

/* ===== PRODUCT GRID ===== */
.container{
  max-width:1200px;
  margin:20px auto;
  padding:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:26px;
}

/* ===== PRODUCT CARD ===== */
.product-card{
  background:linear-gradient(180deg, var(--glass), rgba(255,255,255,0.02));
  border:1px solid var(--border);
  backdrop-filter: blur(14px);
  padding:16px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,0.5);
  transition:0.35s ease;
}

.product-card:hover{
  transform:translateY(-8px) scale(1.02);
  box-shadow:0 30px 60px rgba(0,0,0,.7);
}

.product-card img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:14px;
}

.product-card h3{
  margin:14px 0 6px;
  font-size:20px;
}

.price{
  font-weight:600;
  opacity:0.85;
}

/* ===== QTY SELECTOR ===== */
.qty-box{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
  margin:14px 0;
}

.qty-box button{
  width:36px;
  height:36px;
  border-radius:50%;
  border:none;
  background:var(--green);
  color:black;
  font-size:20px;
  cursor:pointer;
  font-weight:bold;
}

.qty-box span{
  font-size:18px;
  min-width:20px;
}

/* ===== ADD BUTTON ===== */
.btn-add{
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:black;
  border:none;
  padding:12px;
  width:100%;
  border-radius:14px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:0.3s;
}

.btn-add:hover{
  transform:scale(1.04);
  box-shadow:0 10px 30px rgba(34,197,94,.5);
}

/* ===== CHECKOUT ===== */
.checkout-btn{
  display:block;
  width:240px;
  margin:40px auto;
  text-align:center;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:black;
  padding:14px;
  border-radius:16px;
  font-weight:800;
  text-decoration:none;
  box-shadow:0 20px 40px rgba(0,0,0,.6);
}
</style>
</head>

<body>

<nav class="navbar">
  <div class="logo">FarmOS 🌿</div>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="product.html">Shop</a></li>
    <li><a href="checkout.html">Cart</a></li>
  </ul>
</nav>

<div class="cart-icon">
  🛒 <span id="cart-count">0</span>
</div>

<h1>Fresh Vegetables</h1>

<div class="container">

<!-- PRODUCT -->
<div class="product-card">
  <img src="https://raw.githubusercontent.com/yashasawale05-blip/FARMOS-0.2/main/tomato.jpg">
  <h3>Tomato</h3>
  <div class="price">₹40 / kg</div>

  <div class="qty-box">
    <button onclick="changeQty('Tomato',-1)">−</button>
    <span id="qty-Tomato">0</span>
    <button onclick="changeQty('Tomato',1)">+</button>
  </div>

  <button class="btn-add"
    onclick="addToCart('Tomato',40,'https://raw.githubusercontent.com/yashasawale05-blip/FARMOS-0.2/main/tomato.jpg')">
    Add to Cart
  </button>
</div>

<div class="product-card">
  <img src="https://github.com/yashasawale05-blip/FARMOS-0.2/blob/main/potato.jpg?raw=true">
  <h3>Potato</h3>
  <div class="price">₹25 / kg</div>

  <div class="qty-box">
    <button onclick="changeQty('Potato',-1)">−</button>
    <span id="qty-Potato">0</span>
    <button onclick="changeQty('Potato',1)">+</button>
  </div>

  <button class="btn-add"
    onclick="addToCart('Potato',25,'https://github.com/yashasawale05-blip/FARMOS-0.2/blob/main/potato.jpg?raw=true')">
    Add to Cart
  </button>
</div>

<div class="product-card">
  <img src="https://github.com/yashasawale05-blip/FARMOS-0.2/blob/main/onion.jpg?raw=true">
  <h3>Onion</h3>
  <div class="price">₹40 / kg</div>

  <div class="qty-box">
    <button onclick="changeQty('Onion',-1)">−</button>
    <span id="qty-Onion">0</span>
    <button onclick="changeQty('Onion',1)">+</button>
  </div>

  <button class="btn-add"
    onclick="addToCart('Onion',40,'https://github.com/yashasawale05-blip/FARMOS-0.2/blob/main/onion.jpg?raw=true')">
    Add to Cart
  </button>
</div>

<div class="product-card">
  <img src="https://github.com/yashasawale05-blip/FARMOS-0.2/blob/main/carrot.jpg?raw=true">
  <h3>Carrot</h3>
  <div class="price">₹40 / kg</div>

  <div class="qty-box">
    <button onclick="changeQty('Carrot',-1)">−</button>
    <span id="qty-Carrot">0</span>
    <button onclick="changeQty('Carrot',1)">+</button>
  </div>

  <button class="btn-add"
    onclick="addToCart('Carrot',40,'https://github.com/yashasawale05-blip/FARMOS-0.2/blob/main/carrot.jpg?raw=true')">
    Add to Cart
  </button>
</div>

</div>

<a href="checkout.html" class="checkout-btn">Go to Checkout</a>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let quantities = {};
updateCartCount();

function changeQty(name, change){
  if(!quantities[name]) quantities[name] = 0;
  quantities[name] += change;
  if(quantities[name] < 0) quantities[name] = 0;
  document.getElementById("qty-"+name).innerText = quantities[name];
}

function addToCart(name, price, image){
  let kg = quantities[name] > 0 ? quantities[name] : 1;
  let existing = cart.find(item => item.name === name);

  if(existing){
    existing.kg += kg;
  } else {
    cart.push({ name, price, image, kg });
  }

  quantities[name] = 0;
  document.getElementById("qty-"+name).innerText = 0;

  localStorage.setItem("cart", JSON.stringify(cart));
  updateCartCount();
}

function updateCartCount(){
  let totalKg = cart.reduce((sum,item)=>sum+item.kg,0);
  document.getElementById("cart-count").innerText = totalKg;
}
</script>

</body>
    </html>
