<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarmOS Admin — Delivered Orders</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Segoe UI, Arial;
  background:#f8fafc;
  color:#0f172a;
}

/* NAVBAR */
.navbar{
  background:white;
  padding:16px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #e5e7eb;
}

.navbar strong{
  color:#16a34a;
  font-size:20px;
}

.navbar a{
  text-decoration:none;
  color:#2563eb;
  font-weight:600;
}

/* CONTAINER */
.container{
  max-width:1000px;
  margin:30px auto;
  padding:20px;
}

/* CARD */
.card{
  background:white;
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
  margin-bottom:20px;
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
}

th, td{
  padding:12px;
  border-bottom:1px solid #e5e7eb;
  text-align:left;
  font-size:14px;
}

th{
  background:#f1f5f9;
  font-weight:700;
}

.status{
  color:#16a34a;
  font-weight:700;
}
</style>
</head>

<body>

<div class="navbar">
  <strong>FarmOS Admin 🚚</strong>
  <a href="admin.html">← Back to Dashboard</a>
</div>

<div class="container">

  <div class="card">
    <h2>Delivered Order History</h2>
    <p>Orders successfully collected by customers at checkpoints</p>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Customer</th>
          <th>Checkpoint</th>
          <th>Total (₹)</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="deliveredList"></tbody>
    </table>
  </div>

</div>

<script>
const deliveredOrders =
  JSON.parse(localStorage.getItem("deliveredOrders")) || [];

function renderDelivered(){
  let html = "";

  if(deliveredOrders.length === 0){
    html = `<tr><td colspan="5">No delivered orders yet 🚜</td></tr>`;
  }

  deliveredOrders.forEach(o=>{
    html += `
      <tr>
        <td>#${o.id}</td>
        <td>${o.customer}</td>
        <td>${o.checkpoint}</td>
        <td>₹${o.total}</td>
        <td class="status">Delivered</td>
      </tr>
    `;
  });

  document.getElementById("deliveredList").innerHTML = html;
}

renderDelivered();
</script>

</body>
  </html>
