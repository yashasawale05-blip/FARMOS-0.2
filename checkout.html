 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FarmOS — Checkout</title>

<style>
:root { --green:#2f7a32; }

body {
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background:#f6fff4;
}

header {
  background:var(--green);
  color:white;
  padding:15px;
  text-align:center;
}

.checkout-container {
  max-width:900px;
  margin:30px auto;
  padding:15px;
}

.order-card {
  background:white;
  border-radius:12px;
  padding:20px;
  box-shadow:0 8px 26px rgba(0,0,0,0.12);
}

.cart-item {
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.cart-img {
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:8px;
}

.cart-info { flex:1; }

.cart-info strong {
  display:block;
  font-size:16px;
}

.kg-input {
  width:70px;
  padding:6px;
  text-align:center;
  border-radius:6px;
  border:1px solid #ccc;
  font-weight:bold;
}

.item-total {
  min-width:80px;
  font-weight:bold;
  text-align:right;
}

.summary-row {
  display:flex;
  justify-content:space-between;
  margin-top:15px;
  font-size:18px;
  font-weight:bold;
}

/* PAYMENT */
.payment-box { margin-top:20px; }

.payment-option {
  display:block;
  padding:12px;
  border:2px solid #ddd;
  border-radius:10px;
  margin-bottom:10px;
  cursor:pointer;
  font-weight:bold;
}

.payment-option:hover {
  border-color:var(--green);
}

.order-btn {
  width:100%;
  margin-top:20px;
  background:var(--green);
  color:white;
  border:none;
  padding:14px;
  font-size:16px;
  border-radius:10px;
  cursor:pointer;
}

.back-link {
  display:inline-block;
  margin-top:15px;
  text-decoration:none;
  color:var(--green);
  font-weight:bold;
}

.empty {
  text-align:center;
  padding:25px;
  color:#555;
}

/* ===== MODAL ===== */
.modal {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content {
  background:white;
  padding:25px;
  border-radius:14px;
  text-align:center;
  width:90%;
  max-width:400px;
  animation:pop 0.3s ease;
}

@keyframes pop {
  from {transform:scale(0.8); opacity:0;}
  to {transform:scale(1); opacity:1;}
}

.modal h2 { color:var(--green); }

.modal button {
  margin-top:15px;
  background:var(--green);
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
<h1>🧺 Your Cart</h1>
</header>

<div class="checkout-container">
<div class="order-card">

<div id="cart-items"></div>

<div class="summary-row">
<span>Total</span>
<span>₹<span id="total-price">0</span></span>
</div>

<h3 style="margin-top:20px">Payment Method</h3>

<div class="payment-box">
<label class="payment-option">
<input type="radio" name="payment" value="Cash on Delivery"> Cash on Delivery
</label>

<label class="payment-option">
<input type="radio" name="payment" value="UPI"> UPI (Google Pay / PhonePe)
</label>
</div>

<button class="order-btn" onclick="placeOrder()">Place Order</button>
<a href="products.html" class="back-link">← Continue Shopping</a>

</div>
</div>

<!-- ===== ORDER CONFIRM MODAL ===== -->
<div class="modal" id="orderModal">
<div class="modal-content">
<h2>✅ Order Confirmed</h2>
<p id="paymentText"></p>
<button onclick="finishOrder()">Continue Shopping</button>
</div>
</div>

<script>
function placeOrder() {
  const payment = document.querySelector('input[name="payment"]:checked');
  if (!payment) {
    alert("Please select payment method ⚠️");
    return;
  }

  let orders = JSON.parse(localStorage.getItem("orders")) || [];

  orders.push({
    id: Date.now(),
    items: cart,
    total: document.getElementById("total-price").innerText,
    payment: payment.value,
    status: "Pending"
  });

  localStorage.setItem("orders", JSON.stringify(orders));
  localStorage.removeItem("cart");

  alert("Order placed successfully 🌱");
  window.location.href = "product.html";
}
</script>


</body>
 </html>
