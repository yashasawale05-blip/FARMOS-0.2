<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarmOS Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI, Arial;background:#f8fafc;color:#0f172a;}
.navbar{background:white;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e5e7eb;}
.navbar strong{color:#16a34a;font-size:20px;}
.btn{padding:8px 14px;border:none;border-radius:10px;background:#16a34a;color:white;font-weight:700;cursor:pointer;margin-left:10px;}
.logout{background:#ef4444;}
.container{max-width:900px;margin:30px auto;padding:20px;}
.card{background:white;border-radius:18px;padding:20px;box-shadow:0 10px 25px rgba(0,0,0,.08);margin-bottom:20px;}
.checkpoint{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #e5e7eb;}
.checkpoint:last-child{border:none;}
.info strong{color:#16a34a;font-size:16px;}
.status{font-weight:700;}
.pending{color:#f59e0b;}
.reached{color:#16a34a;}
.nav-actions{display:flex;gap:10px;}
</style>
</head>
<body>

<div class="navbar">
  <strong>FarmOS Admin 🚚</strong>
  <div class="nav-actions">
    <button class="btn" onclick="location.href='admin-orders.html'">Orders</button>
    <button class="btn" onclick="location.href='admin-history.html'">Delivered History</button>
    <button class="btn logout" onclick="logout()">Logout</button>
  </div>
</div>

<div class="container">
  <div class="card">
    <h2>📊 Order Statistics</h2>
    <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:15px; margin-top:15px;">
      <div class="card"><strong>Total Orders</strong><br><span id="totalOrders">0</span></div>
      <div class="card"><strong>Delivered</strong><br><span id="deliveredOrders" style="color:#16a34a">0</span></div>
      <div class="card"><strong>Pending</strong><br><span id="pendingOrders" style="color:#f59e0b">0</span></div>
      <div class="card"><strong>Total Veggie Packs</strong><br><span id="totalPacks">0</span></div>
    </div>
  </div>

  <div style="margin-top:15px; display:flex; gap:10px;">
    <button class="btn" onclick="location.href='admin-orders.html'">View Customer Orders</button>
    <button class="btn" onclick="location.href='admin-history.html'">Delivered Order History</button>
  </div>

  <div class="card" id="checkpointList"></div>
</div>

<script>
// Load active customer orders from localStorage
let checkpoints = JSON.parse(localStorage.getItem("customerOrders")) || [];

function render(){
  let html = "";

  if(checkpoints.length === 0){
    html = "<p>No active orders yet</p>";
  } else {
    checkpoints.forEach((c, i) => {
      html += `
        <div class="checkpoint">
          <div class="info">
            <strong>${c.customer}</strong><br>
            Address: ${c.address}<br>
            Veggie Packs: ${c.items}
          </div>
          <div>
            <div class="status ${c.status}">
              ${c.status === "pending" ? "Pending" : "Delivered"}
            </div>
            ${
              c.status === "pending"
                ? `<button class="btn" onclick="markReached(${i})">Mark Delivered</button>`
                : ``
            }
          </div>
        </div>
      `;
    });
  }

  document.getElementById("checkpointList").innerHTML = html;
  }

function markReached(i){
  let orders = JSON.parse(localStorage.getItem("customerOrders")) || [];
  let deliveredHistory = JSON.parse(localStorage.getItem("deliveredHistory")) || [];

  let order = orders[i];
  if(order.status === "delivered") return;

  // mark as delivered
  order.status = "delivered";

  // push to delivered history
  deliveredHistory.push({
    id: order.id,
    customer: order.customer,
    items: order.items,
    date: new Date().toLocaleString()
  });

  // save back
  orders[i] = order;
  localStorage.setItem("customerOrders", JSON.stringify(orders));
  localStorage.setItem("deliveredHistory", JSON.stringify(deliveredHistory));

  checkpoints = orders; // update the array used for render
  render();
  updateStats();
}

function updateStats(){
  let deliveredHistory = JSON.parse(localStorage.getItem("deliveredHistory")) || [];
  let totalOrders = checkpoints.reduce((sum,c)=>sum+c.orders,0);
  let deliveredOrders = deliveredHistory.reduce((sum,h)=>sum+parseInt(h.items),0);
  let pendingOrders = totalOrders - deliveredOrders;
  document.getElementById("totalOrders").innerText = totalOrders;
  document.getElementById("deliveredOrders").innerText = deliveredOrders;
  document.getElementById("pendingOrders").innerText = pendingOrders<0?0:pendingOrders;
  document.getElementById("totalPacks").innerText = totalOrders;
}

function logout(){
  alert("Logged out successfully");
  location.href="index.html";
}

render();
updateStats();
</script>
</body>
</html>
