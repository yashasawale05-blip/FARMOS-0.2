<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarmOS Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Segoe UI, Arial;
  background:#f8fafc;
  color:#0f172a;
}

/* NAVBAR */
.navbar{
  background:white;
  padding:16px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #e5e7eb;
}

.navbar strong{
  color:#16a34a;
  font-size:20px;
}

/* BUTTON STYLE */
.btn{
  padding:8px 14px;
  border:none;
  border-radius:10px;
  background:#16a34a;
  color:white;
  font-weight:700;
  cursor:pointer;
  margin-left:10px;
}

.logout{
  background:#ef4444;
}

/* CONTAINER */
.container{
  max-width:900px;
  margin:30px auto;
  padding:20px;
}

/* CARD */
.card{
  background:white;
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
  margin-bottom:20px;
}

/* CHECKPOINT */
.checkpoint{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid #e5e7eb;
}
.checkpoint:last-child{border:none}

.info strong{
  color:#16a34a;
  font-size:16px;
}

/* STATUS */
.status{
  font-weight:700;
}
.pending{color:#f59e0b}
.reached{color:#16a34a}

.nav-actions{
  display:flex;
  gap:10px;
}
</style>
</head>

<body>

<div class="navbar">
  <strong>FarmOS Admin 🚚</strong>

  <div class="nav-actions">
    <button class="btn" onclick="location.href='admin-orders.html'">
      Orders
    </button>

    <button class="btn" onclick="location.href='admin-history.html'">
      Delivered History
    </button>

    <button class="btn logout" onclick="logout()">
      Logout
    </button>
  </div>
</div>

<div class="container">

  <div class="card">
  <h2>📊 Order Statistics</h2>

  <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:15px; margin-top:15px;">

    <div class="card">
      <strong>Total Orders</strong><br>
      <span id="totalOrders">0</span>
    </div>

    <div class="card">
      <strong>Delivered</strong><br>
      <span id="deliveredOrders" style="color:#16a34a">0</span>
    </div>

    <div class="card">
      <strong>Pending</strong><br>
      <span id="pendingOrders" style="color:#f59e0b">0</span>
    </div>

    <div class="card">
      <strong>Total Veggie Packs</strong><br>
      <span id="totalPacks">0</span>
    </div>

  </div>
  </div>

    <div style="margin-top:15px; display:flex; gap:10px;">
      <button class="btn" onclick="location.href='admin-orders.html'">
        View Customer Orders
      </button>

      <button class="btn" onclick="location.href='admin-history.html'">
        Delivered Order History
      </button>
    </div>
  </div>

  <div class="card" id="checkpointList"></div>

</div>

<script>
const checkpoints = [
  {name:"Main Vegetable Market", orders:42, status:"pending"},
  {name:"Hotel Zone East", orders:18, status:"pending"},
  {name:"Residential Sector 5", orders:27, status:"pending"},
  {name:"Highway Pickup Point", orders:15, status:"pending"}
];

function render(){
  let html = "";

  checkpoints.forEach((c, i) => {
    html += `
      <div class="checkpoint">
        <div class="info">
          <strong>${c.name}</strong><br>
          Orders: ${c.orders}
        </div>
        <div>
          <div class="status ${c.status}">
            ${c.status === "pending" ? "Pending" : "Reached"}
          </div>
          ${
            c.status === "pending"
              ? `<button class="btn" onclick="markReached(${i})">Mark Reached</button>`
              : ``
          }
        </div>
      </div>
    `;
  });

  document.getElementById("checkpointList").innerHTML = html;
}

  function markReached(i){

  if(checkpoints[i].status === "reached"){
    return; // already delivered
  }

  checkpoints[i].status = "reached";

  let history = JSON.parse(localStorage.getItem("deliveredHistory")) || [];

  history.push({
    id: "ORD-" + Date.now(),
    customer: checkpoints[i].name,
    items: checkpoints[i].orders,
    date: new Date().toLocaleString()
  });

  localStorage.setItem("deliveredHistory", JSON.stringify(history));

  render();
  updateStats();
}
  function updateStats(){

  let deliveredHistory = JSON.parse(localStorage.getItem("deliveredHistory")) || [];

  let deliveredCount = deliveredHistory.length;
  let totalOrders = checkpoints.reduce((sum,c)=> sum + c.orders, 0);
  let deliveredOrders = deliveredHistory.reduce((sum,h)=> sum + parseInt(h.items), 0);

  let pendingOrders = totalOrders - deliveredOrders;

  document.getElementById("totalOrders").innerText = totalOrders;
  document.getElementById("deliveredOrders").innerText = deliveredOrders;
  document.getElementById("pendingOrders").innerText = pendingOrders < 0 ? 0 : pendingOrders;
  document.getElementById("totalPacks").innerText = totalOrders;
  }

function logout(){
  alert("Logged out successfully");
  location.href="index.html";
}

render();
updateStats();
</script>

</body>
</html>
