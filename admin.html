<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarmOS Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Segoe UI, Arial;
  background:#f8fafc;
  color:#0f172a;
}

/* HIDE DASHBOARD UNTIL LOGIN */
#dashboard{ display:none; }

/* NAVBAR */
.navbar{
  background:#ffffff;
  padding:16px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #e5e7eb;
}

.navbar strong{
  color:#16a34a;
  font-size:20px;
}

.navbar button{
  padding:8px 14px;
  border:none;
  border-radius:10px;
  background:#ef4444;
  color:white;
  font-weight:700;
  cursor:pointer;
}

/* CONTAINER */
.container{
  max-width:900px;
  margin:30px auto;
  padding:20px;
}

/* CARD */
.card{
  background:white;
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
  margin-bottom:20px;
}

/* CHECKPOINT */
.checkpoint{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid #e5e7eb;
}
.checkpoint:last-child{border:none}

.info strong{
  color:#16a34a;
  font-size:16px;
}

/* STATUS */
.status{
  font-weight:700;
}
.pending{color:#f59e0b}
.reached{color:#16a34a}

/* BUTTON */
.btn{
  margin-top:6px;
  padding:8px 14px;
  border:none;
  border-radius:10px;
  background:#16a34a;
  color:white;
  font-weight:700;
  cursor:pointer;
}

/* LOGIN MODAL */
.modal{
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.4);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:1000;
}

.modal-content{
  background:white;
  padding:30px 24px;
  border-radius:18px;
  max-width:400px;
  width:90%;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
  text-align:center;
}

.modal-content h2{
  color:#16a34a;
  margin-bottom:20px;
}

.modal-content input{
  width:100%;
  padding:12px;
  margin-bottom:16px;
  border-radius:10px;
  border:1px solid #e5e7eb;
  font-size:16px;
}

.modal-content button{
  padding:12px 20px;
  border:none;
  border-radius:10px;
  background:#16a34a;
  color:white;
  font-weight:700;
  cursor:pointer;
  width:100%;
  font-size:16px;
}

.error-msg{
  color:#ef4444;
  margin-bottom:12px;
  font-weight:600;
  display:none;
}
</style>
</head>

<body>

<!-- LOGIN MODAL -->
<div class="modal" id="loginModal">
  <div class="modal-content">
    <h2>Admin Login</h2>
    <div class="error-msg" id="errorMsg">Incorrect password!</div>
    <input type="password" id="adminPassword" placeholder="Enter password">
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="navbar">
    <strong>FarmOS Admin 🚚</strong>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="container">
    <div class="card">
      <h2>Truck Checkpoints</h2>
      <p>Farmer-led distribution control panel</p>
    </div>

    <div class="card" id="checkpointList"></div>
  </div>
</div>

<script>
const ADMIN_PASSWORD = "Farmos123"; // Change your admin password here

const checkpoints = [
  {name:"Main Vegetable Market", orders:42, status:"pending"},
  {name:"Hotel Zone East", orders:18, status:"pending"},
  {name:"Residential Sector 5", orders:27, status:"pending"},
  {name:"Highway Pickup Point", orders:15, status:"pending"}
];

function render(){
  let html="";
  checkpoints.forEach((c,i)=>{
    html+=`
      <div class="checkpoint">
        <div class="info">
          <strong>${c.name}</strong><br>
          Orders: ${c.orders}
        </div>
        <div>
          <div class="status ${c.status}">
            ${c.status === "pending" ? "Pending" : "Reached"}
          </div>
          ${
            c.status === "pending"
            ? `<button class="btn" onclick="markReached(${i})">Mark Reached</button>`
            : ``
          }
        </div>
      </div>
    `;
  });
  document.getElementById("checkpointList").innerHTML = html;
}

function markReached(i){
  checkpoints[i].status = "reached";
  render();
}

function logout(){
  alert("Logged out");
  location.reload();
}

// LOGIN FUNCTION
function login(){
  const input = document.getElementById("adminPassword").value;
  const error = document.getElementById("errorMsg");
  if(input === ADMIN_PASSWORD){
    document.getElementById("loginModal").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    render();
  } else {
    error.style.display = "block";
  }
}
</script>

</body>
</html>
