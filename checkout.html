<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarmOS — Checkout</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --green:#22c55e;
  --bg:#020617;
  --accent:#f6f6e9;
  --glass:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.12);
  --btn-gradient: linear-gradient(135deg,#22c55e,#16a34a);
}

body{
  margin:0;
  font-family: 'Segoe UI', Arial;
  background:
    linear-gradient(180deg, rgba(0,0,0,.6), rgba(0,0,0,.95)),
    url("https://images.unsplash.com/photo-1506806732259-39c2d0268443");
  background-size:cover;
  background-attachment:fixed;
  color:#e5e7eb;
}

/* HEADER */
h1{text-align:center;margin:20px}

/* BACK BUTTON */
.back{
  display:inline-block;
  margin:10px 20px;
  background:var(--green);
  color:black;
  padding:10px 16px;
  border-radius:12px;
  text-decoration:none;
  font-weight:700;
  transition:0.3s;
}
.back:hover{
  transform:scale(1.05);
  box-shadow:0 6px 20px rgba(34,197,94,0.5);
}

/* CART BOX */
.cart{
  max-width:800px;
  margin:20px auto;
  padding:20px;
  background:rgba(255,255,255,0.05);
  border-radius:20px;
  backdrop-filter:blur(12px);
  box-shadow:0 20px 40px rgba(0,0,0,.5);
}

/* CART ITEM */
.item{
  display:flex;
  align-items:center;
  gap:16px;
  background:rgba(255,255,255,0.03);
  padding:12px;
  border-radius:14px;
  margin-bottom:12px;
  transition:0.3s;
}
.item:hover{
  background:rgba(255,255,255,0.06);
  transform:scale(1.01);
}

.item img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid var(--border);
}

/* INFO & QTY */
.info{flex:1}

.qty{
  display:flex;
  gap:10px;
}

.qty button{
  width:30px;
  height:30px;
  border-radius:50%;
  border:none;
  background:var(--green);
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}
.qty button:hover{
  transform:scale(1.1);
  box-shadow:0 4px 15px rgba(34,197,94,0.5);
}

/* TOTAL & PLACE ORDER */
.total{
  text-align:right;
  font-size:20px;
  margin-top:20px;
  font-weight:700;
}

.place{
  display:block;
  margin:30px auto;
  background:var(--btn-gradient);
  color:white;
  padding:14px;
  border-radius:16px;
  width:240px;
  text-align:center;
  font-weight:900;
  text-decoration:none;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 8px 25px rgba(34,197,94,0.6);
}
.place:hover{
  transform:scale(1.05);
  box-shadow:0 12px 35px rgba(34,197,94,0.7);
}

/* CART ICON (REALISTIC) */
.cart-icon{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  font-size:20px;
  margin:10px 0;
}
.cart-icon img{
  width:36px;
  height:36px;
}
</style>
</head>

<body>

<a href="product.html" class="back">← Back to Shop</a>

<h1>Checkout</h1>

<div class="cart" id="cartBox"></div>

<div class="total">
  <div class="cart-icon">
    <img src="https://cdn-icons-png.flaticon.com/512/1170/1170576.png" alt="cart">
    Total: ₹<span id="totalPrice">0</span>
  </div>
</div>

<a href="#" class="place" onclick="placeOrder()">Place Order</a>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || {};
render();

/* RENDER CHECKOUT ITEMS */
function render(){
  let html="", total=0;
  for(let name in cart){
    let item = cart[name];
    let itemTotal = item.kg * item.price;
    total += itemTotal;

    html += `
    <div class="item">
      <img src="${item.img}">
      <div class="info">
        <strong>${name}</strong><br>
        ₹${item.price} / kg
      </div>
      <div class="qty">
        <button onclick="change('${name}',-1)">−</button>
        <span>${item.kg}</span>
        <button onclick="change('${name}',1)">+</button>
      </div>
      <strong>₹${itemTotal}</strong>
    </div>`;
  }

  document.getElementById("cartBox").innerHTML =
    html || "<p style='text-align:center;margin:20px'>Your cart is empty 🌱</p>";
  document.getElementById("totalPrice").innerText = total;
  localStorage.setItem("cart",JSON.stringify(cart));
}

/* CHANGE QTY */
function change(name,val){
  if(!cart[name]) return;
  cart[name].kg += val;
  if(cart[name].kg<=0) delete cart[name];
  render();
}

/* PLACE ORDER */
function placeOrder(){
  if(Object.keys(cart).length===0){
    alert("Your cart is empty 🌱");
    return;
  }
  alert("Order placed successfully 🌿");
  localStorage.removeItem("cart");
  window.location.href="product.html";
}
</script>

</body>
</html>
