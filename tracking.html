<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarmOS — Order Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --green:#22c55e;
  --bg:#020617;
  --card:#111827;
  --line:#1f2937;
  --accent:#fbbf24;
}

body{
  margin:0;
  font-family:Segoe UI, Arial;
  background:linear-gradient(180deg,#020617,#000);
  color:#e5e7eb;
}

/* NAV */
.navbar{
  padding:14px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(14px);
}
.navbar a{
  color:#e5e7eb;
  text-decoration:none;
  font-weight:600;
}

/* CONTAINER */
.container{
  max-width:500px;
  margin:30px auto;
  padding:22px;
}

/* ORDER CARD */
.order-card{
  background:var(--card);
  border-radius:20px;
  padding:20px;
  box-shadow:0 0 30px rgba(34,197,94,.15);
  margin-bottom:22px;
}
.order-card h2{
  margin:0;
  color:var(--green);
}
.order-card p{
  opacity:.8;
  font-size:14px;
}

/* MAP ICON */
.map{
  text-align:center;
  font-size:60px;
  margin:20px 0;
  animation:float 2s infinite ease-in-out;
}
@keyframes float{
  50%{transform:translateY(-6px)}
}

/* PROGRESS */
.progress{
  background:var(--line);
  height:8px;
  border-radius:10px;
  overflow:hidden;
  margin:16px 0;
}
.bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#22c55e,#4ade80);
  animation:fill 6s forwards;
}
@keyframes fill{
  100%{width:100%}
}

/* STEPS */
.step{
  display:flex;
  align-items:center;
  gap:14px;
  margin:14px 0;
}
.dot{
  width:14px;
  height:14px;
  border-radius:50%;
  background:var(--green);
}
.step span{
  opacity:.9;
}

/* ETA */
.eta{
  text-align:center;
  font-size:18px;
  margin-top:18px;
  color:var(--accent);
}

/* BUTTONS */
.actions{
  display:flex;
  gap:12px;
  margin-top:24px;
}
.btn{
  flex:1;
  padding:14px;
  border:none;
  border-radius:16px;
  font-weight:900;
  cursor:pointer;
}
.shop{
  background:linear-gradient(135deg,#22c55e,#16a34a);
}
.support{
  background:#020617;
  color:var(--accent);
  border:2px solid var(--accent);
}
</style>
</head>

<body>

<div class="navbar">
  <strong>FarmOS 🌿</strong>
  <a href="product.html">← Shop</a>
</div>

<div class="container">

  <div class="order-card">
    <h2>Order Confirmed</h2>
    <p>Order ID: <strong>#FMOS1029</strong></p>
    <p>Fresh vegetables from farm to your door 🌱</p>
  </div>

  <div class="map">📍</div>

  <div class="progress">
    <div class="bar"></div>
  </div>

  <div class="order-card">
    <div class="step">
      <div class="dot"></div>
      <span>Order Placed</span>
    </div>
    <div class="step">
      <div class="dot"></div>
      <span>Farmer Preparing Produce</span>
    </div>
    <div class="step">
      <div class="dot"></div>
      <span>Out for Delivery</span>
    </div>
    <div class="step">
      <div class="dot"></div>
      <span>Delivered to You</span>
    </div>

    <!-- LIVE COUNTDOWN -->
    <div class="eta" id="countdown">
      Estimated delivery in: <strong>30:00</strong>
    </div>
  </div>

  <div class="actions">
    <button class="btn shop" onclick="location.href='product.html'">
      Continue Shopping
    </button>
    <button class="btn support" onclick="alert('Support coming soon ☎️')">
      Help
    </button>
  </div>

</div>

<script>
let deliveryMinutes = 30;
let endTime = Date.now() + deliveryMinutes * 60 * 1000;

function updateCountdown(){
  let diff = endTime - Date.now();
  if(diff <= 0){
    document.getElementById("countdown").innerHTML =
      "✅ Delivered! Enjoy fresh food 🌿";
    return;
  }
  let min = Math.floor(diff / 60000);
  let sec = Math.floor((diff % 60000) / 1000);
  document.querySelector("#countdown strong").innerText =
    `${min}:${sec.toString().padStart(2,"0")}`;
}
setInterval(updateCountdown,1000);
updateCountdown();
</script>

</body>
</html>
