<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FarmOS — Admin Panel</title>

<style>
:root { --green:#2f7a32; }

body {
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background:#f4fff3;
}

header {
  background:var(--green);
  color:white;
  padding:15px;
  text-align:center;
}

.container {
  max-width:1000px;
  margin:30px auto;
  padding:15px;
}

.order-card {
  background:white;
  border-radius:12px;
  padding:18px;
  margin-bottom:20px;
  box-shadow:0 8px 24px rgba(0,0,0,0.12);
}

.order-header {
  display:flex;
  justify-content:space-between;
  font-weight:bold;
  margin-bottom:10px;
}

.items {
  margin-top:10px;
}

.item {
  display:flex;
  gap:10px;
  align-items:center;
  border-bottom:1px solid #eee;
  padding:8px 0;
}

.item img {
  width:45px;
  height:45px;
  border-radius:6px;
  object-fit:cover;
}

.status-select {
  margin-top:12px;
  padding:8px;
  border-radius:8px;
  border:1px solid #ccc;
  font-weight:bold;
}

.empty {
  text-align:center;
  font-size:18px;
  color:#666;
  margin-top:40px;
}
</style>
</head>

<body>

<header>
<h1>🧑‍💼 Admin — Orders Dashboard</h1>
</header>

<div class="container" id="orders-container"></div>

<script>
let orders = JSON.parse(localStorage.getItem("orders")) || [];
const container = document.getElementById("orders-container");

if (orders.length === 0) {
  container.innerHTML = "<div class='empty'>No orders yet 📦</div>";
}

orders.forEach((order, index) => {
  let itemsHTML = "";

  order.items.forEach(item => {
    itemsHTML += `
      <div class="item">
        <img src="${item.image}">
        <div>
          <strong>${item.name}</strong><br>
          ${item.kg} kg × ₹${item.price}
        </div>
      </div>
    `;
  });

  container.innerHTML += `
    <div class="order-card">
      <div class="order-header">
        <span>Order ID: ${order.id}</span>
        <span>₹${order.total}</span>
      </div>

      <div><strong>Payment:</strong> ${order.payment}</div>

      <div class="items">${itemsHTML}</div>

      <select class="status-select" onchange="updateStatus(${index}, this.value)">
        <option ${order.status === "Pending" ? "selected" : ""}>Pending</option>
        <option ${order.status === "Shipped" ? "selected" : ""}>Shipped</option>
        <option ${order.status === "Delivered" ? "selected" : ""}>Delivered</option>
      </select>
    </div>
  `;
});

function updateStatus(index, status) {
  orders[index].status = status;
  localStorage.setItem("orders", JSON.stringify(orders));
  alert("Order status updated ✅");
}
</script>

</body>
</html>
