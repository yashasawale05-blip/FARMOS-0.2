<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarmOS — Admin Truck Checkpoints</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --green:#22c55e;
  --bg:#f9fafb;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --border:#e5e7eb;
}

body{
  margin:0;
  font-family:Segoe UI, Arial;
  background:var(--bg);
  color:var(--text);
}

/* NAVBAR */
.navbar{
  padding:16px 26px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#ffffff;
  border-bottom:1px solid var(--border);
}
.navbar strong{
  font-size:18px;
}
.navbar a{
  color:var(--green);
  text-decoration:none;
  font-weight:600;
}

/* CONTAINER */
.container{
  max-width:900px;
  margin:32px auto;
  padding:0 20px;
}

/* HEADER CARD */
.header-card{
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
  border-radius:20px;
  padding:22px;
  margin-bottom:26px;
}
.header-card h2{
  margin:0;
}
.header-card p{
  opacity:.9;
  margin-top:6px;
}

/* CARD */
.card{
  background:var(--card);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.06);
}

/* CHECKPOINT */
.checkpoint{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px;
  border-bottom:1px solid var(--border);
}
.checkpoint:last-child{border:none}

.info strong{
  font-size:16px;
  color:var(--text);
}
.info{
  font-size:14px;
  color:var(--muted);
}

/* STATUS */
.status{
  font-weight:700;
  font-size:14px;
}
.pending{color:#f59e0b}
.reached{color:#22c55e}

/* BUTTON */
.btn{
  margin-top:6px;
  padding:8px 14px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
}

/* NOTE */
.note{
  margin-top:26px;
  font-size:13px;
  color:var(--muted);
  background:#ffffff;
  border-radius:16px;
  padding:16px;
  box-shadow:0 10px 20px rgba(0,0,0,.05);
}
</style>
</head>

<body>

<div class="navbar">
  <strong>FarmOS 🌿 Admin</strong>
  <a href="index.html">Home</a>
</div>

<div class="container">

  <div class="header-card">
    <h2>🚚 Truck Checkpoint Control</h2>
    <p>Farmer-driven distribution • Order code handover system</p>
  </div>

  <div class="card" id="checkpointList"></div>

  <div class="note">
    ✔ Farmers hand over pre-packed orders at checkpoints<br>
    ✔ Order code stamped on packets<br>
    ✔ Admin manually confirms truck arrival
  </div>

</div>

<script>
const checkpoints = [
  {name:"Main Vegetable Market", orders:42, status:"pending"},
  {name:"Hotel Zone – East", orders:18, status:"pending"},
  {name:"Residential Area – Sector 5", orders:27, status:"pending"},
  {name:"Highway Outlet Stop", orders:15, status:"pending"}
];

function render(){
  let html="";
  checkpoints.forEach((c,i)=>{
    html+=`
      <div class="checkpoint">
        <div class="info">
          <strong>${c.name}</strong><br>
          Orders: ${c.orders}
        </div>
        <div>
          <span class="status ${c.status}">
            ${c.status === "pending" ? "Pending" : "Reached"}
          </span><br>
          ${
            c.status === "pending"
            ? `<button class="btn" onclick="markReached(${i})">Mark Reached</button>`
            : ``
          }
        </div>
      </div>
    `;
  });
  document.getElementById("checkpointList").innerHTML = html;
}

function markReached(index){
  checkpoints[index].status = "reached";
  render();
}

render();
</script>

</body>
</html>
