<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarmOS — Secure Payment</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --green:#22c55e;
  --bg:#020617;
  --card:#111827;
  --accent:#fbbf24;
}

body{
  margin:0;
  font-family:Segoe UI, Arial;
  background:var(--bg);
  color:#e5e7eb;
}

/* NAVBAR */
.navbar{
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(14px);
  padding:14px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.navbar a{
  color:#e5e7eb;
  text-decoration:none;
  font-weight:600;
}
.navbar a:hover{color:var(--green);}

.container{
  max-width:900px;
  margin:20px auto;
  padding:20px;
}

/* CARD */
.card{
  background:var(--card);
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
}

/* HEADINGS */
h2{margin:0 0 12px;color:var(--green);}
label{font-size:14px;opacity:.85}

/* INPUTS */
input,select{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:10px;
  border:none;
  outline:none;
  background:#020617;
  color:white;
}

/* PAYMENT METHODS */
.methods{
  display:flex;
  gap:12px;
  margin-top:10px;
}
.method{
  flex:1;
  padding:14px;
  background:#020617;
  border-radius:14px;
  text-align:center;
  cursor:pointer;
  border:2px solid transparent;
}
.method.active{
  border-color:var(--green);
  background:#0f172a;
}

/* ORDER SUMMARY */
.summary div{
  display:flex;
  justify-content:space-between;
  margin:6px 0;
}

/* BUTTON */
.pay{
  width:100%;
  padding:16px;
  border:none;
  border-radius:18px;
  font-size:18px;
  font-weight:900;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  cursor:pointer;
  margin-top:10px;
}
.pay:disabled{
  opacity:.6;
  cursor:not-allowed;
}

/* LOADER */
.loader{
  display:none;
  text-align:center;
  margin-top:20px;
}
.spinner{
  width:40px;
  height:40px;
  border:4px solid #333;
  border-top:4px solid var(--green);
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:0 auto 10px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* SUCCESS */
.success{
  display:none;
  text-align:center;
}
.success h1{color:var(--green)}
.success p{opacity:.9}
.success a{
  display:inline-block;
  margin-top:20px;
  padding:14px 30px;
  background:var(--green);
  color:black;
  border-radius:14px;
  text-decoration:none;
  font-weight:900;
}
</style>
</head>

<body>

<div class="navbar">
  <strong>FarmOS 🌿 Secure Payment</strong>
  <a href="checkout.html">← Back</a>
</div>

<div class="container" id="mainPage">

<!-- ADDRESS -->
<div class="card">
  <h2>Delivery Address</h2>
  <input id="name" placeholder="Full Name">
  <input id="phone" placeholder="Mobile Number">
  <input id="address" placeholder="House / Street">
  <input id="city" placeholder="City">
  <input id="pin" placeholder="Pincode">
</div>

<!-- PAYMENT -->
<div class="card">
  <h2>Payment Method</h2>
  <div class="methods">
    <div class="method" onclick="selectPay('UPI')">UPI</div>
    <div class="method" onclick="selectPay('CARD')">Card</div>
    <div class="method" onclick="selectPay('COD')">COD</div>
  </div>
</div>

<!-- SUMMARY -->
<div class="card">
  <h2>Order Summary</h2>
  <div id="items"></div>
  <div class="summary">
    <div><strong>Total</strong><strong>₹<span id="total">0</span></strong></div>
  </div>
</div>

<button class="pay" onclick="payNow()">Pay Now</button>

<div class="loader" id="loader">
  <div class="spinner"></div>
  <p>Processing secure payment...</p>
</div>

</div>

<!-- SUCCESS PAGE -->
<div class="container success" id="successPage">
  <h1>Payment Successful 🎉</h1>
  <p>Your order has been placed successfully.</p>
  <p><strong>Order ID:</strong> FM<span id="orderId"></span></p>
  <p>Estimated delivery in 2 days 🌱</p>
  <a href="tracking.html">Track Your Order 🚚</a>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || {};
let payment = "";

/* LOAD SUMMARY */
let total=0, html="";
for(let k in cart){
  let t = cart[k].kg * cart[k].price;
  total += t;
  html += `<div>${k} × ${cart[k].kg}<span>₹${t}</span></div>`;
}
document.getElementById("items").innerHTML = html || "Cart empty";
document.getElementById("total").innerText = total;

/* PAYMENT SELECT */
function selectPay(p){
  payment=p;
  document.querySelectorAll(".method").forEach(m=>m.classList.remove("active"));
  event.target.classList.add("active");
}

/* PAY */
function payNow(){
  if(!payment){
    alert("Please select payment method");
    return;
  }
  if(!name.value || !phone.value || !address.value){
    alert("Please fill address");
    return;
  }

  if(payment==="COD"){
    success();
    return;
  }

  document.querySelector(".pay").disabled=true;
  document.getElementById("loader").style.display="block";

  setTimeout(success,2500);
}

/* SUCCESS */
function success(){
  localStorage.removeItem("cart");
  document.getElementById("mainPage").style.display="none";
  document.getElementById("successPage").style.display="block";
  document.getElementById("orderId").innerText = Math.floor(100000+Math.random()*900000);
}
</script>

</body>
</html>
