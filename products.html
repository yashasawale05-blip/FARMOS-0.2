<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>FarmOS — Shop</title>

  <style>
    :root{--green:#2f7a32}
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:#f7fff7;
    }

    .navbar{
      background:var(--green);
      padding:12px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      color:#fff;
      position:sticky;
      top:0;
    }

    .nav-links{
      display:flex;
      gap:18px;
      list-style:none;
      margin:0;
      padding:0;
    }

    .nav-links a{
      color:white;
      text-decoration:none;
      font-weight:bold;
    }

    .container{
      max-width:1200px;
      margin:30px auto;
      padding:15px;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
      gap:20px;
    }

    .product-card{
      background:white;
      padding:15px;
      border-radius:12px;
      text-align:center;
      box-shadow:0 8px 22px rgba(0,0,0,0.1);
    }

    .product-card img{
      width:100%;
      height:180px;
      object-fit:cover;
      border-radius:8px;
    }

    .product-card h3{
      margin:10px 0;
      color:var(--green);
    }

    .price{
      font-weight:bold;
      margin-bottom:8px;
    }

    .btn-add{
      background:var(--green);
      color:white;
      border:none;
      padding:10px;
      width:100%;
      border-radius:8px;
      cursor:pointer;
      font-size:15px;
    }

    .cart-icon{
      position:fixed;
      top:20px;
      right:20px;
      background:var(--green);
      color:white;
      padding:10px 14px;
      border-radius:20px;
      font-weight:bold;
    }

    .checkout-btn{
      display:block;
      width:220px;
      margin:30px auto;
      text-align:center;
      background:var(--green);
      color:white;
      padding:12px;
      border-radius:10px;
      text-decoration:none;
    }
  </style>
</head>

<body>

<nav class="navbar">
  <div class="logo">FarmOS 🌿</div>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="product.html">Shop</a></li>
    <li><a href="checkout.html">Cart</a></li>
  </ul>
</nav>

<div class="cart-icon">
  Cart: <span id="cart-count">0</span>
</div>

<h1 style="text-align:center;color:#2f7a32;margin-top:20px">
  Fresh Vegetables
</h1>

<div class="container">

  <div class="product-card">
    <img src="https://raw.githubusercontent.com/yashasawale05-blip/FARMOS-0.2/main/tomato.jpg" alt="Tomato">
    <h3>Tomato</h3>
    <div class="price">₹40 / kg</div>
    <button class="btn-add"
      onclick="addToCart('Tomato',40,'https://raw.githubusercontent.com/yashasawale05-blip/FARMOS-0.2/main/tomato.jpg')">
      Add to Cart
    </button>
  </div>

  <div class="product-card">
    <img src="https://github.com/yashasawale05-blip/FARMOS-0.2/blob/main/potato.jpg?raw=true" alt="Potato">
    <h3>Potato</h3>
    <div class="price">₹25 / kg</div>
    <button class="btn-add"
      onclick="addToCart('Potato',25,'https://github.com/yashasawale05-blip/FARMOS-0.2/blob/main/potato.jpg?raw=true')">
      Add to Cart
    </button>
  </div>

  <div class="product-card">
    <img src="https://github.com/yashasawale05-blip/FARMOS-0.2/blob/main/onion.jpg?raw=true" alt="Onion">
    <h3>Onion</h3>
    <div class="price">₹40 / kg</div>
    <button class="btn-add"
      onclick="addToCart('Onion',40,'https://github.com/yashasawale05-blip/FARMOS-0.2/blob/main/onion.jpg?raw=true')">
      Add to Cart
    </button>
  </div>

  <div class="product-card">
    <img src="https://github.com/yashasawale05-blip/FARMOS-0.2/blob/main/carrot.jpg?raw=true" alt="Carrot">
    <h3>Carrot</h3>
    <div class="price">₹40 / kg</div>
    <button class="btn-add"
      onclick="addToCart('Carrot',40,'https://github.com/yashasawale05-blip/FARMOS-0.2/blob/main/carrot.jpg?raw=true')">
      Add to Cart
    </button>
  </div>

</div>

<a href="checkout.html" class="checkout-btn">Go to Checkout</a>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
updateCartCount();

function addToCart(name, price, image) {
  let existing = cart.find(item => item.name === name);

  if (existing) {
    existing.kg += 1;
  } else {
    cart.push({
      name: name,
      price: price,
      image: image,
      kg: 1
    });
  }

  localStorage.setItem("cart", JSON.stringify(cart));
  updateCartCount();
}

function updateCartCount() {
  let totalKg = cart.reduce((sum, item) => sum + item.kg, 0);
  document.getElementById("cart-count").innerText = totalKg;
}
</script>

</body>
  </html>
