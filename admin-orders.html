<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Customer Orders</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Segoe UI, Arial;
  background:#f8fafc;
}

.navbar{
  background:white;
  padding:16px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #e5e7eb;
}

.navbar strong{
  color:#16a34a;
  font-size:20px;
}

.container{
  max-width:1000px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
  margin-bottom:20px;
}

.order{
  padding:12px 0;
  border-bottom:1px solid #e5e7eb;
}

.order:last-child{border:none}

.btn{
  padding:8px 14px;
  border:none;
  border-radius:10px;
  background:#16a34a;
  color:white;
  font-weight:700;
  cursor:pointer;
}

.pending{color:#f59e0b;font-weight:bold}
.delivered{color:#16a34a;font-weight:bold}
</style>
</head>

<body>

<div class="navbar">
  <strong>Customer Orders 📦</strong>
  <button class="btn" onclick="location.href='admin.html'">Back</button>
</div>

<div class="container">

  <div class="card">
    <h2>Active Orders</h2>
    <p>Orders placed by customers</p>
  </div>

  <div class="card" id="orderList"></div>

</div>

<script>
// DEMO DATA (REMOVE LATER WHEN CUSTOMER FLOW READY)
if(!localStorage.getItem("customerOrders")){
  localStorage.setItem("customerOrders", JSON.stringify([
    {
      id:"ORD-1001",
      customer:"Rahul",
      items:5,
      address:"Mumbai",
      status:"pending"
    },
    {
      id:"ORD-1002",
      customer:"Amit",
      items:3,
      address:"Pune",
      status:"pending"
    }
  ]));
}

function loadOrders(){
  let orders = JSON.parse(localStorage.getItem("orders")) || [];

  if(orders.length === 0){
    document.getElementById("ordersList").innerHTML = "<p>No orders yet</p>";
    return;
  }

  let html = "";
  orders.forEach(o => {
    html += `
      <div class="order-item">
        <strong>Order ID:</strong> ${o.id}<br>
        <strong>Customer:</strong> ${o.customer}<br>
        <strong>Items:</strong> ${o.items}<br>
        <strong>Status:</strong> ${o.status}
      </div>
    `;
  });

  document.getElementById("ordersList").innerHTML = html;
}

loadOrders();
function markDelivered(index){

  let orders = JSON.parse(localStorage.getItem("customerOrders")) || [];
  let deliveredHistory = JSON.parse(localStorage.getItem("deliveredHistory")) || [];

  let order = orders[index];

  // move to delivered history
  deliveredHistory.push({
    id: order.id,
    customer: order.customer,
    items: order.items,
    date: new Date().toLocaleString()
  });

  // remove from active orders
  orders.splice(index,1);

  localStorage.setItem("customerOrders", JSON.stringify(orders));
  localStorage.setItem("deliveredHistory", JSON.stringify(deliveredHistory));

  loadOrders();
}

loadOrders();
</script>

</body>
</html>
