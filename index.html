<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FarmOS — Premium Fresh</title>

<style>
:root{
  --green:#4caf50;
  --dark:#0f1b13;
  --card:#16261c;
}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--dark);
  color:#eaeaea;
}
.navbar{
  background:#0b1510;
  padding:15px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.navbar h2{color:var(--green);margin:0}
.navbar a{
  color:#ddd;
  text-decoration:none;
  margin-left:18px;
  font-weight:bold;
}
.navbar a:hover{color:var(--green)}

.hero{
  height:90vh;
  background:
    linear-gradient(rgba(0,0,0,0.75),rgba(0,0,0,0.75)),
    url("https://images.unsplash.com/photo-1567306226416-28f0efdc88ce");
  background-size:cover;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.hero h1{font-size:52px}
.hero p{font-size:20px}
.hero button{
  background:var(--green);
  border:none;
  padding:14px 30px;
  border-radius:30px;
  font-weight:bold;
  cursor:pointer;
}

.features{
  padding:60px 20px;
  text-align:center;
}
.feature-box{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:22px;
}
.card{
  background:var(--card);
  padding:28px;
  border-radius:18px;
}
footer{
  background:#0b1510;
  text-align:center;
  padding:18px;
}
</style>
</head>

<body>

<div class="navbar">
  <h2>FarmOS 🌿</h2>
  <div>
    <a href="index.html">Home</a>
    <a href="product.html">Shop</a>
    <a href="checkout.html">Cart</a>
  </div>
</div>

<section class="hero">
  <div>
    <h1>Premium Fresh Vegetables</h1>
    <p>Direct from farms • No middlemen</p>
    <button onclick="window.location.href='product.html'">Shop Now 🛒</button>
  </div>
</section>

<section class="features">
  <h2>Why FarmOS</h2>
  <div class="feature-box">
    <div class="card">🌱 Farm Direct</div>
    <div class="card">💎 Premium Quality</div>
    <div class="card">🚚 Fast Delivery</div>
    <div class="card">💰 Fair Pricing</div>
  </div>
</section>

<footer>© 2025 FarmOS 🌿</footer>

</body>
</html>
