<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarmOS — Order Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --green:#22c55e;
  --bg:#020617;
  --card:#111827;
  --line:#1f2937;
  --accent:#fbbf24;
}

body{
  margin:0;
  font-family:Segoe UI, Arial;
  background:linear-gradient(180deg,#020617,#000);
  color:#e5e7eb;
}

/* NAV */
.navbar{
  padding:14px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(14px);
}
.navbar a{
  color:#e5e7eb;
  text-decoration:none;
  font-weight:600;
}

/* CONTAINER */
.container{
  max-width:520px;
  margin:30px auto;
  padding:22px;
}

/* CARD */
.card{
  background:var(--card);
  border-radius:20px;
  padding:20px;
  box-shadow:0 0 30px rgba(34,197,94,.15);
  margin-bottom:22px;
}

/* STATUS */
.status{
  font-size:18px;
  color:var(--accent);
  margin-top:10px;
}

/* ROAD */
.road{
  position:relative;
  width:100%;
  height:70px;
  background:linear-gradient(90deg,#1f2937,#020617);
  border-radius:40px;
  overflow:hidden;
  margin:20px 0;
}

/* DUST */
.dust{
  position:absolute;
  bottom:10px;
  width:6px;
  height:6px;
  background:#9ca3af;
  border-radius:50%;
  opacity:.4;
  animation:dust 1.5s linear infinite;
}
@keyframes dust{
  0%{left:100%; opacity:.5}
  100%{left:-10px; opacity:0}
}

/* TRUCK */
.truck{
  position:absolute;
  right:-80px;
  top:10px;
  font-size:42px;
  animation:drive 18s linear infinite;
}
@keyframes drive{
  0%{ right:-80px }
  100%{ right:110% }
}

/* STEPS */
.step{
  display:flex;
  align-items:center;
  gap:12px;
  margin:12px 0;
}
.dot{
  width:14px;
  height:14px;
  border-radius:50%;
  background:#374151;
}
.active .dot{
  background:var(--green);
}
.step span{
  opacity:.9;
}

/* BUTTON */
.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:16px;
  font-weight:900;
  cursor:pointer;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  margin-top:20px;
}
</style>
</head>

<body>

<div class="navbar">
  <strong>FarmOS 🌿</strong>
  <a href="product.html">← Shop</a>
</div>

<div class="container">

  <div class="card">
    <h2>Order Confirmed</h2>
    <p>Order ID: <strong>#FMOS1029</strong></p>
    <div class="status" id="statusText">Order received</div>
  </div>

  <div class="road">
    <div class="truck">🚚</div>
    <div class="dust"></div>
    <div class="dust" style="animation-delay:.5s"></div>
    <div class="dust" style="animation-delay:1s"></div>
  </div>

  <div class="card">
    <div class="step" id="s1"><div class="dot"></div><span>Order Placed</span></div>
    <div class="step" id="s2"><div class="dot"></div><span>Packed in Truck</span></div>
    <div class="step" id="s3"><div class="dot"></div><span>Truck Started</span></div>
    <div class="step" id="s4"><div class="dot"></div><span>Reached Checkpoint</span></div>
    <div class="step" id="s5"><div class="dot"></div><span>Ready for Pickup</span></div>
  </div>

  <button class="btn" onclick="location.href='product.html'">
    Continue Shopping
  </button>

</div>

<script>
const steps = [
  {id:"s1", text:"Order confirmed"},
  {id:"s2", text:"Packed in truck"},
  {id:"s3", text:"Truck started from farm"},
  {id:"s4", text:"Truck reached checkpoint"},
  {id:"s5", text:"Collect your packed order"}
];

let index = 0;

function updateStep(){
  if(index >= steps.length) return;
  document.getElementById(steps[index].id).classList.add("active");
  document.getElementById("statusText").innerText = steps[index].text;
  index++;
}

updateStep();
setInterval(updateStep, 5000);
</script>

</body>
      </html>
