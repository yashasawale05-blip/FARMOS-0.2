<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarmOS — Admin Truck Checkpoints</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --green:#22c55e;
  --bg:#020617;
  --card:#111827;
  --accent:#fbbf24;
  --line:#1f2937;
}

body{
  margin:0;
  font-family:Segoe UI, Arial;
  background:linear-gradient(180deg,#020617,#000);
  color:#e5e7eb;
}

/* NAVBAR */
.navbar{
  padding:14px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(14px);
}
.navbar a{
  color:#e5e7eb;
  text-decoration:none;
  font-weight:600;
}

/* CONTAINER */
.container{
  max-width:800px;
  margin:30px auto;
  padding:22px;
}

/* CARD */
.card{
  background:var(--card);
  border-radius:20px;
  padding:20px;
  box-shadow:0 0 30px rgba(34,197,94,.15);
  margin-bottom:20px;
}

/* CHECKPOINT */
.checkpoint{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px;
  border-bottom:1px solid var(--line);
}
.checkpoint:last-child{border:none}

.info{
  font-size:14px;
}
.info strong{
  font-size:16px;
  color:var(--green);
}

/* STATUS */
.status{
  font-weight:700;
  font-size:14px;
}
.pending{color:#fbbf24}
.reached{color:#22c55e}

/* BUTTON */
.btn{
  padding:8px 14px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
  background:linear-gradient(135deg,#22c55e,#16a34a);
}

/* FOOTER NOTE */
.note{
  margin-top:20px;
  font-size:13px;
  opacity:.7;
}
</style>
</head>

<body>

<div class="navbar">
  <strong>FarmOS 🌿 Admin</strong>
  <a href="index.html">Home</a>
</div>

<div class="container">

  <div class="card">
    <h2>🚚 Truck Checkpoints</h2>
    <p>Live operational control — farmer distribution model</p>
  </div>

  <div class="card" id="checkpointList"></div>

  <div class="note">
    ✔ Admin updates checkpoint status manually after truck arrival.<br>
    ✔ Customers collect orders using stamped Order ID.
  </div>

</div>

<script>
const checkpoints = [
  {name:"Main Vegetable Market", orders:42, status:"pending"},
  {name:"Hotel Zone – East", orders:18, status:"pending"},
  {name:"Residential Area – Sector 5", orders:27, status:"pending"},
  {name:"Highway Outlet Stop", orders:15, status:"pending"}
];

function render(){
  let html="";
  checkpoints.forEach((c,i)=>{
    html+=`
      <div class="checkpoint">
        <div class="info">
          <strong>${c.name}</strong><br>
          Orders: ${c.orders}
        </div>
        <div>
          <span class="status ${c.status}">
            ${c.status === "pending" ? "Pending" : "Reached"}
          </span><br>
          ${
            c.status === "pending"
            ? `<button class="btn" onclick="markReached(${i})">Mark Reached</button>`
            : ``
          }
        </div>
      </div>
    `;
  });
  document.getElementById("checkpointList").innerHTML = html;
}

function markReached(index){
  checkpoints[index].status = "reached";
  render();
}

render();
</script>

</body>
</html>
